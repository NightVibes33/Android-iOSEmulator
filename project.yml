name: AndroidiOSEmulator
options:
  bundleIdPrefix: com.nightvibes
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "26.0"
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    ENABLE_BITCODE: NO
    ONLY_ACTIVE_ARCH: NO
    ARCHS: arm64
    GENERATE_INFOPLIST_FILE: NO
    CLANG_ENABLE_MODULES: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
targets:
  AndroidiOSEmulator:
    type: application
    platform: iOS
    sources:
      - path: AndroidiOSEmulator
        excludes:
          - Config/AndroidiOSEmulator.entitlements
    info:
      path: AndroidiOSEmulator/Config/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightvibes.androidiosemulator
        PRODUCT_NAME: AndroidiOSEmulator
        PRODUCT_MODULE_NAME: AndroidiOSEmulator
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: AndroidiOSEmulator/Config/AndroidiOSEmulator.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: AndroidiOSEmulator/JIT/BridgingHeader.h
        INFOPLIST_FILE: AndroidiOSEmulator/Config/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEAD_CODE_STRIPPING: YES
        STRIP_INSTALLED_PRODUCT: NO
        COPY_PHASE_STRIP: NO
    scheme:
      testTargets: []
