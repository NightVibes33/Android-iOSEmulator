name: Publish verified ARM64 Redroid IPA

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Workflow run containing the validated unsigned IPA artifact
        required: true
        default: "29949669780"
        type: string
  workflow_run:
    workflows: ["Request verified ARM64 IPA release"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-redroid-arm64-ipa
  cancel-in-progress: false

env:
  DEFAULT_SOURCE_RUN_ID: "29949669780"
  SOURCE_COMMIT: "988f8005012506867fe7485151816541a3ddd7b8"
  RELEASE_TAG: v0.4.0-redroid13-arm64-se-nojit
  IPA_NAME: Android-iOSEmulator-Redroid13-ARM64-SE-NoJIT-unsigned.ipa
  ARTIFACT_NAME: Android-iOSEmulator-Redroid13-ARM64-SE-NoJIT-unsigned

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Publish already validated IPA
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Download validated IPA artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id }}
        run: |
          set -euo pipefail
          SOURCE_RUN_ID="${INPUT_SOURCE_RUN_ID:-$DEFAULT_SOURCE_RUN_ID}"
          mkdir -p downloaded-ipa
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir downloaded-ipa
          IPA="$(find downloaded-ipa -type f -name "$IPA_NAME" -print -quit)"
          test -n "$IPA"
          echo "SOURCE_RUN_ID=$SOURCE_RUN_ID" >> "$GITHUB_ENV"
          echo "IPA=$IPA" >> "$GITHUB_ENV"

      - name: Reverify exact release payload
        shell: bash
        run: |
          set -euo pipefail
          test -f "$IPA"
          unzip -t "$IPA" >/dev/null
          IPA_SIZE="$(stat -c%s "$IPA")"
          test "$IPA_SIZE" -lt 2147483648
          shasum -a 256 "$IPA" | tee "$IPA.sha256"
          MANIFEST="$(find downloaded-ipa -type f -name build-manifest.txt -print -quit)"
          IMPORT_METADATA="$(find downloaded-ipa -type f -name livecontainer-import-metadata.txt -print -quit)"
          test -n "$MANIFEST"
          test -n "$IMPORT_METADATA"
          grep -q '^Guest architecture: aarch64$' "$MANIFEST"
          grep -q '^Android runtime: Redroid 13 64-bit only$' "$MANIFEST"
          grep -q '^CI Android boot verification: passed$' "$MANIFEST"
          grep -q '^JIT required by LiveContainer: no$' "$MANIFEST"
          grep -q '^isJITNeeded=false$' "$IMPORT_METADATA"
          echo "IPA_SIZE=$IPA_SIZE" >> "$GITHUB_ENV"

      - name: Create tag and clean prerelease through GitHub REST
        shell: bash
        env:
          API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          AUTH=(-H "Authorization: Bearer $API_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          TAG_ENCODED="$(jq -rn --arg value "$RELEASE_TAG" '$value|@uri')"

          EXISTING_CODE="$(curl -sS -o existing-release.json -w '%{http_code}' "${AUTH[@]}" "$API/releases/tags/$TAG_ENCODED")"
          if [[ "$EXISTING_CODE" == "200" ]]; then
            RELEASE_ID="$(jq -r .id existing-release.json)"
            curl --fail-with-body -sS -X DELETE "${AUTH[@]}" "$API/releases/$RELEASE_ID"
          elif [[ "$EXISTING_CODE" != "404" ]]; then
            cat existing-release.json >&2
            exit 1
          fi

          DELETE_TAG_CODE="$(curl -sS -o delete-tag.json -w '%{http_code}' -X DELETE "${AUTH[@]}" "$API/git/refs/tags/$TAG_ENCODED")"
          if [[ "$DELETE_TAG_CODE" == "422" ]] && jq -e '.message == "Reference does not exist"' delete-tag.json >/dev/null; then
            echo "Release tag is already absent; continuing."
          elif [[ "$DELETE_TAG_CODE" != "204" && "$DELETE_TAG_CODE" != "404" ]]; then
            cat delete-tag.json >&2
            exit 1
          fi

          git tag -d "$RELEASE_TAG" >/dev/null 2>&1 || true
          git tag "$RELEASE_TAG" HEAD
          git push origin "refs/tags/$RELEASE_TAG"

          NOTES='One complete unsigned LiveContainer IPA. CI booted the exact ARM64 kernel, initramfs and root disk from source workflow run 29949669780 and required Android 13 to report sys.boot_completed=1 before packaging. The runtime contains no x86 Android guest and requests no JIT. Physical iPhone 16 / iOS 27 beta 3 boot remains a separate device-validation gate.'
          jq -n --arg tag_name "$RELEASE_TAG" --arg name "Android iOSEmulator — Redroid 13 ARM64 no-JIT" --arg body "$NOTES" '{tag_name:$tag_name,name:$name,body:$body,draft:false,prerelease:true,generate_release_notes:false}' > create-release-request.json

          CREATE_CODE="$(curl -sS -D create-release-headers.txt -o release.json -w '%{http_code}' -X POST "${AUTH[@]}" -H 'Content-Type: application/json' --data-binary @create-release-request.json "$API/releases")"
          cat create-release-headers.txt
          cat release.json
          test "$CREATE_CODE" = "201"
          RELEASE_ID="$(jq -r .id release.json)"
          UPLOAD_URL="$(jq -r .upload_url release.json)"
          test -n "$RELEASE_ID"
          test -n "$UPLOAD_URL"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          echo "UPLOAD_URL=$UPLOAD_URL" >> "$GITHUB_ENV"

      - name: Upload complete IPA through GitHub REST
        shell: bash
        env:
          API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTH=(-H "Authorization: Bearer $API_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          BASE_UPLOAD_URL="${UPLOAD_URL%%\{*}"
          ASSET_NAME_ENCODED="$(jq -rn --arg value "$IPA_NAME" '$value|@uri')"
          UPLOAD_CODE="$(curl -sS -D upload-headers.txt -o uploaded-asset.json -w '%{http_code}' -X POST "${AUTH[@]}" -H 'Content-Type: application/octet-stream' --upload-file "$IPA" "$BASE_UPLOAD_URL?name=$ASSET_NAME_ENCODED")"
          cat upload-headers.txt
          cat uploaded-asset.json
          test "$UPLOAD_CODE" = "201"
          test "$(jq -r .name uploaded-asset.json)" = "$IPA_NAME"
          test "$(jq -r .state uploaded-asset.json)" = "uploaded"
          test "$(jq -r .size uploaded-asset.json)" -eq "$IPA_SIZE"

      - name: Verify published asset through GitHub REST
        shell: bash
        env:
          API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          AUTH=(-H "Authorization: Bearer $API_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          curl --fail-with-body -sS "${AUTH[@]}" "$API/releases/$RELEASE_ID" > verified-release.json
          test "$(jq '.assets | length' verified-release.json)" -eq 1
          test "$(jq -r '.assets[0].name' verified-release.json)" = "$IPA_NAME"
          test "$(jq '.assets[0].size' verified-release.json)" -eq "$IPA_SIZE"
          test "$(jq -r '.prerelease' verified-release.json)" = true
          jq '{url:.html_url,assets,isPrerelease:.prerelease,targetCommitish:.target_commitish}' verified-release.json > release.json

      - name: Record verified release marker
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_URL="$(jq -r .url release.json)"
          mkdir -p .github/release-status
          jq -n --arg tag "$RELEASE_TAG" --arg release_url "$RELEASE_URL" --arg asset_name "$IPA_NAME" --argjson asset_size_bytes "$IPA_SIZE" --arg workflow_run_id "$SOURCE_RUN_ID" --arg source_commit "$SOURCE_COMMIT" '{verified:true,android_version:13,android_sys_boot_completed:true,runtime:"Redroid 13 arm64-only",guest_architecture:"aarch64",execution_mode:"UTM SE interpreter",jit_required:false,tag:$tag,release_url:$release_url,asset_name:$asset_name,asset_size_bytes:$asset_size_bytes,workflow_run_id:$workflow_run_id,source_commit:$source_commit,physical_iphone_boot_verified:false}' > .github/release-status/redroid-arm64-se.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/release-status/redroid-arm64-se.json
          git commit -m "Record verified no-JIT ARM64 Android release"
          git pull --rebase origin main
          git push origin HEAD:main
