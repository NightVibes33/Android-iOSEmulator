name: Apply Redroid binderfs allocation fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-redroid-binderfs-allocation.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add binder-control device allocator to generated guest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/build_redroid_arm64_rootfs.sh')
          text = path.read_text(encoding='utf-8')

          anchor = '''replacements.append((old_image, new_image, "ext4 image population"))

          old_ui_env = """export XDG_RUNTIME_DIR=/run/weston
          '''
          insertion = r'''replacements.append((old_image, new_image, "ext4 image population"))

          old_binder_service = """printf '[6/10] Installing BinderFS, Android and fullscreen UI services\\n'
          cat > "$ROOTFS/usr/local/sbin/start-redroid" <<'START'
          #!/bin/sh
          set -eu
          mkdir -p /var/lib/redroid/data /run/redroid /dev/binderfs
          if ! mountpoint -q /dev/binderfs; then
            mount -t binder binder /dev/binderfs
          fi
          grep -qw binder /proc/filesystems
          for node in binder hwbinder vndbinder; do
          """
          new_binder_service = """printf '[6/10] Installing BinderFS, Android and fullscreen UI services\\n'
          cat > "$WORK/binderfs-device.c" <<'BINDERFS_ALLOCATOR'
          #include <errno.h>
          #include <fcntl.h>
          #include <linux/android/binder.h>
          #include <linux/android/binderfs.h>
          #include <stdio.h>
          #include <string.h>
          #include <sys/ioctl.h>
          #include <sys/stat.h>
          #include <unistd.h>

          int main(int argc, char **argv) {
              int fd;
              int result = 0;

              if (argc < 2) {
                  fprintf(stderr, "usage: %s <binder-name>...\\n", argv[0]);
                  return 64;
              }

              fd = open("/dev/binderfs/binder-control", O_RDONLY | O_CLOEXEC);
              if (fd < 0) {
                  perror("open binder-control");
                  return 1;
              }

              for (int i = 1; i < argc; i++) {
                  struct binderfs_device device = {0};
                  char path[256];
                  size_t length = strlen(argv[i]);

                  if (length == 0 || length >= BINDERFS_MAX_NAME) {
                      fprintf(stderr, "invalid binder device name: %s\\n", argv[i]);
                      result = 1;
                      continue;
                  }

                  snprintf(path, sizeof(path), "/dev/binderfs/%s", argv[i]);
                  if (access(path, F_OK) == 0) {
                      if (chmod(path, 0666) < 0) {
                          perror("chmod existing binder device");
                          result = 1;
                      }
                      continue;
                  }

                  memcpy(device.name, argv[i], length + 1);
                  if (ioctl(fd, BINDER_CTL_ADD, &device) < 0) {
                      if (errno != EEXIST) {
                          fprintf(stderr, "BINDER_CTL_ADD %s: %s\\n", argv[i], strerror(errno));
                          result = 1;
                          continue;
                      }
                  }
                  if (chmod(path, 0666) < 0) {
                      fprintf(stderr, "chmod %s: %s\\n", path, strerror(errno));
                      result = 1;
                  }
              }

              close(fd);
              return result;
          }
          BINDERFS_ALLOCATOR
          aarch64-linux-gnu-gcc -O2 -Wall -Wextra "$WORK/binderfs-device.c" -o "$WORK/binderfs-device"
          install -m 0755 "$WORK/binderfs-device" "$ROOTFS/usr/local/sbin/binderfs-device"

          cat > "$ROOTFS/usr/local/sbin/start-redroid" <<'START'
          #!/bin/sh
          set -eu
          mkdir -p /var/lib/redroid/data /run/redroid /dev/binderfs
          if ! mountpoint -q /dev/binderfs; then
            mount -t binder binder /dev/binderfs
          fi
          grep -qw binder /proc/filesystems
          /usr/local/sbin/binderfs-device binder hwbinder vndbinder
          for node in binder hwbinder vndbinder; do
          """
          replacements.append((old_binder_service, new_binder_service, "BinderFS device allocator"))

          old_ui_env = """export XDG_RUNTIME_DIR=/run/weston
          '''
          if text.count(anchor) != 1:
              raise SystemExit(f'Expected one BinderFS insertion anchor, found {text.count(anchor)}')
          text = text.replace(anchor, insertion)

          old_verify = '''new_verify = """test -x \\"$ROOTFS/usr/bin/scrcpy\\"
          test -s \\"$ROOTFS/opt/scrcpy/scrcpy-server\\"
          '''
          new_verify = '''new_verify = """test -x \\"$ROOTFS/usr/bin/scrcpy\\"
          test -x \\"$ROOTFS/usr/local/sbin/binderfs-device\\"
          test -s \\"$ROOTFS/opt/scrcpy/scrcpy-server\\"
          '''
          if text.count(old_verify) != 1:
              raise SystemExit(f'Expected one generated verification anchor, found {text.count(old_verify)}')
          text = text.replace(old_verify, new_verify)

          manifest_anchor = '''new_manifest = """Root filesystem: sparse raw ext4
          Root filesystem metadata: ownership, hardlinks, ACLs and xattrs preserved
          '''
          manifest_new = '''new_manifest = """Root filesystem: sparse raw ext4
          BinderFS device allocation: binder-control BINDER_CTL_ADD helper
          Root filesystem metadata: ownership, hardlinks, ACLs and xattrs preserved
          '''
          if text.count(manifest_anchor) != 1:
              raise SystemExit(f'Expected one manifest anchor, found {text.count(manifest_anchor)}')
          text = text.replace(manifest_anchor, manifest_new)

          path.write_text(text, encoding='utf-8')
          PY

          bash -n scripts/build_redroid_arm64_rootfs.sh
          grep -Fq 'BINDER_CTL_ADD' scripts/build_redroid_arm64_rootfs.sh
          grep -Fq '/usr/local/sbin/binderfs-device binder hwbinder vndbinder' scripts/build_redroid_arm64_rootfs.sh
          grep -Fq 'BinderFS device allocation: binder-control BINDER_CTL_ADD helper' scripts/build_redroid_arm64_rootfs.sh

          git rm .github/workflows/patch-redroid-binderfs-allocation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/build_redroid_arm64_rootfs.sh
          git commit -m "Allocate BinderFS devices before starting Redroid"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          exit 1
