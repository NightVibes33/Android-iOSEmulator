name: Probe current Redroid ARM64 run

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-current-redroid-run.yml"

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture exact current build run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUNS="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/build-redroid-arm64-se-livecontainer-ipa.yml/runs?branch=main&per_page=20")"
          RUN="$(jq -c '[.workflow_runs[] | select(.head_sha == "a89914cf8f492a8f4b746a1c9bc5f1cf0c263c64")] | sort_by(.created_at) | last' <<<"$RUNS")"
          if [[ "$RUN" == null ]]; then
            RUN="$(jq -c '.workflow_runs | sort_by(.created_at) | last' <<<"$RUNS")"
          fi
          test "$RUN" != null
          RUN_ID="$(jq -r .id <<<"$RUN")"
          JOBS="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100")"
          ARTIFACTS="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100")"

          mkdir -p .github/release-status
          jq -n \
            --argjson run "$RUN" \
            --argjson jobs "$JOBS" \
            --argjson artifacts "$ARTIFACTS" \
            '{
              observed_at: (now | todateiso8601),
              run: {
                id: $run.id,
                head_sha: $run.head_sha,
                status: $run.status,
                conclusion: $run.conclusion,
                created_at: $run.created_at,
                run_started_at: $run.run_started_at,
                updated_at: $run.updated_at,
                attempt: $run.run_attempt,
                html_url: $run.html_url
              },
              jobs: [$jobs.jobs[] | {
                id, name, status, conclusion, started_at, completed_at, html_url,
                steps: [.steps[]? | {number, name, status, conclusion, started_at, completed_at}]
              }],
              artifacts: [$artifacts.artifacts[]? | {id, name, size_in_bytes, expired, created_at}]
            }' > .github/release-status/redroid-current-run.json

          git rm .github/workflows/probe-current-redroid-run.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/release-status/redroid-current-run.json
          git commit -m "Record current Redroid ARM64 run probe"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          exit 1
