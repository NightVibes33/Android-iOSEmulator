name: Probe LiveContainer serial-signer workflow

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-qemu-loader-fix.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record serial-signer workflow state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .github/release-status
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow build-livecontainer-serial-signer.yml \
            --limit 10 \
            --json databaseId,status,conclusion,url,headSha,createdAt,updatedAt,event,displayTitle \
            > .github/release-status/livecontainer-serial-signer-probe.json
          git fetch origin main
          git checkout -B main origin/main
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/release-status/livecontainer-serial-signer-probe.json
          git commit -m "Probe LiveContainer serial-signer build" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

