name: Verify LiveContainer guest release

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/verify-livecontainer-guest-release.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for and verify IPA-only release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.1-livecontainer-guest
          EXPECTED_ASSET: Android-iOSEmulator-LiveContainer-Guest-unsigned.ipa
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              ASSET_COUNT="$(gh release view "$TAG" --json assets --jq '.assets | length')"
              ASSET_NAME="$(gh release view "$TAG" --json assets --jq '.assets[0].name')"
              ASSET_SIZE="$(gh release view "$TAG" --json assets --jq '.assets[0].size')"
              IS_PRERELEASE="$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease')"
              test "$ASSET_COUNT" -eq 1
              test "$ASSET_NAME" = "$EXPECTED_ASSET"
              mkdir -p .github/release-status
              jq -n \
                --arg tag "$TAG" \
                --arg asset "$ASSET_NAME" \
                --argjson asset_count "$ASSET_COUNT" \
                --argjson asset_size "$ASSET_SIZE" \
                --argjson prerelease "$IS_PRERELEASE" \
                --arg verified_by_run "$GITHUB_RUN_ID" \
                '{verified:true, tag:$tag, asset_count:$asset_count, asset_name:$asset, asset_size_bytes:$asset_size, prerelease:$prerelease, verified_by_run:$verified_by_run}' \
                > .github/release-status/livecontainer-guest.json
              exit 0
            fi
            sleep 10
          done
          echo "Release $TAG was not published before the verifier timed out." >&2
          exit 1

      - name: Commit verification status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/release-status/livecontainer-guest.json
          git commit -m "Record verified LiveContainer guest release" || exit 0
          git push
