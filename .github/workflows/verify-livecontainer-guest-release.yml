name: Verify LiveContainer guest release

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/verify-livecontainer-guest-release.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for and verify IPA-only release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.1-livecontainer-guest
          EXPECTED_ASSET: Android-iOSEmulator-LiveContainer-Guest-unsigned.ipa
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            RELEASE_JSON="$(gh release view "$TAG" --json assets,isPrerelease 2>/dev/null || true)"
            if [[ -n "$RELEASE_JSON" ]]; then
              ASSET_COUNT="$(jq '.assets | length' <<<"$RELEASE_JSON")"
              ASSET_NAME="$(jq -r '.assets[0].name // ""' <<<"$RELEASE_JSON")"
              ASSET_SIZE="$(jq '.assets[0].size // 0' <<<"$RELEASE_JSON")"
              IS_PRERELEASE="$(jq '.isPrerelease' <<<"$RELEASE_JSON")"
              if [[ "$ASSET_COUNT" -eq 1 && "$ASSET_NAME" == "$EXPECTED_ASSET" && "$ASSET_SIZE" -gt 500000000 ]]; then
                mkdir -p .github/release-status
                jq -n \
                  --arg tag "$TAG" \
                  --arg asset "$ASSET_NAME" \
                  --argjson asset_count "$ASSET_COUNT" \
                  --argjson asset_size "$ASSET_SIZE" \
                  --argjson prerelease "$IS_PRERELEASE" \
                  --arg verified_by_run "$GITHUB_RUN_ID" \
                  '{verified:true, tag:$tag, asset_count:$asset_count, asset_name:$asset, asset_size_bytes:$asset_size, prerelease:$prerelease, verified_by_run:$verified_by_run}' \
                  > .github/release-status/livecontainer-guest.json
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Release $TAG did not reach the expected one-IPA state before timeout." >&2
          exit 1

      - name: Commit verification status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/release-status/livecontainer-guest.json
          git commit -m "Record verified LiveContainer guest release" || exit 0
          git push
