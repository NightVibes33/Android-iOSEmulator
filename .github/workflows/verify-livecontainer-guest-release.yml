name: Verify Android 13 single-IPA release

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build preinstalled Android 13 LiveContainer guest
    types:
      - completed
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-livecontainer-guest-release.yml"

permissions:
  contents: write

concurrency:
  group: verify-android13-single-ipa-release
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for and verify one complete Android 13 IPA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.2.1-android13-single-ipa
          EXPECTED_IPA: Android-iOSEmulator-Android13-Preinstalled-LiveContainer-Guest-unsigned.ipa
        run: |
          set -euo pipefail

          for attempt in $(seq 1 120); do
            RELEASE_JSON="$(gh release view "$TAG" --json assets,isPrerelease,tagName,url 2>/dev/null || true)"
            if [[ -z "$RELEASE_JSON" ]]; then
              sleep 10
              continue
            fi

            TAG_NAME="$(jq -r '.tagName' <<<"$RELEASE_JSON")"
            RELEASE_URL="$(jq -r '.url' <<<"$RELEASE_JSON")"
            IS_PRERELEASE="$(jq -r '.isPrerelease' <<<"$RELEASE_JSON")"
            ASSET_COUNT="$(jq '.assets | length' <<<"$RELEASE_JSON")"
            ASSET_NAME="$(jq -r '.assets[0].name // ""' <<<"$RELEASE_JSON")"
            ASSET_SIZE="$(jq '.assets[0].size // 0' <<<"$RELEASE_JSON")"
            SPLIT_COUNT="$(jq '[.assets[] | select(.name | contains(".part-"))] | length' <<<"$RELEASE_JSON")"

            if [[ "$TAG_NAME" == "$TAG" && \
                  "$IS_PRERELEASE" == "true" && \
                  "$ASSET_COUNT" -eq 1 && \
                  "$ASSET_NAME" == "$EXPECTED_IPA" && \
                  "$ASSET_SIZE" -gt 500000000 && \
                  "$ASSET_SIZE" -lt 2000000000 && \
                  "$SPLIT_COUNT" -eq 0 ]]; then
              mkdir -p .github/release-status
              jq -n \
                --arg tag "$TAG" \
                --arg release_url "$RELEASE_URL" \
                --arg asset_name "$ASSET_NAME" \
                --argjson asset_size_bytes "$ASSET_SIZE" \
                --argjson prerelease "$IS_PRERELEASE" \
                --arg verified_by_run "$GITHUB_RUN_ID" \
                '{verified:true, android_version:13, distribution:"BlissOS 16.9.7 x86_64 FOSS Go", tag:$tag, release_url:$release_url, delivery_mode:"full-ipa", asset_count:1, part_count:0, asset_name:$asset_name, asset_size_bytes:$asset_size_bytes, prerelease:$prerelease, verified_by_run:$verified_by_run}' \
                > .github/release-status/livecontainer-guest.json
              cat .github/release-status/livecontainer-guest.json
              exit 0
            fi

            sleep 10
          done

          echo "Release $TAG did not reach the required one-IPA state before timeout." >&2
          gh release view "$TAG" --json assets,isPrerelease,tagName,url || true
          exit 1

      - name: Commit verification status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/release-status/livecontainer-guest.json
          git commit -m "Record verified Android 13 single-IPA release" || exit 0
          git push