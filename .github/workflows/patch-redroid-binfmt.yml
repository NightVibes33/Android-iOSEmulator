name: Apply Redroid binfmt fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-redroid-binfmt.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove redundant failing update-binfmts command
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build-redroid-arm64-se-livecontainer-ipa.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          sudo update-binfmts --enable qemu-aarch64
          update-binfmts --display qemu-aarch64
          qemu-system-aarch64 --version
          adb version
'''
          new = '''          test -x /usr/bin/qemu-aarch64-static
          test -e /proc/sys/fs/binfmt_misc/qemu-aarch64
          grep -q '^enabled$' /proc/sys/fs/binfmt_misc/qemu-aarch64
          qemu-system-aarch64 --version
          adb version
'''
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one redundant update-binfmts block')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          git rm .github/workflows/patch-redroid-binfmt.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/build-redroid-arm64-se-livecontainer-ipa.yml
          git commit -m "Fix already-enabled ARM64 binfmt check"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          exit 1
