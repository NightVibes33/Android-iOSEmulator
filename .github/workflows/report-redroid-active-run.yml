name: Report active Redroid run

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/report-redroid-active-run.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record latest Redroid workflow run and jobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .github/release-status

          RUNS_JSON="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/build-redroid-arm64-se-livecontainer-ipa.yml/runs?branch=main&per_page=10")"
          RUN_JSON="$(jq -c '.workflow_runs | sort_by(.created_at) | last' <<<"$RUNS_JSON")"
          test "$RUN_JSON" != null
          RUN_ID="$(jq -r .id <<<"$RUN_JSON")"
          JOBS_JSON="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100")"
          ALL_RUNS_JSON="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=20")"

          jq -n \
            --argjson run "$RUN_JSON" \
            --argjson jobs "$JOBS_JSON" \
            --argjson recent "$ALL_RUNS_JSON" \
            '{
              observed_at: (now | todateiso8601),
              run: {
                id: $run.id,
                name: $run.name,
                path: $run.path,
                head_sha: $run.head_sha,
                event: $run.event,
                status: $run.status,
                conclusion: $run.conclusion,
                created_at: $run.created_at,
                updated_at: $run.updated_at,
                run_started_at: $run.run_started_at,
                html_url: $run.html_url,
                attempt: $run.run_attempt
              },
              jobs: [
                $jobs.jobs[] | {
                  id,
                  name,
                  status,
                  conclusion,
                  started_at,
                  completed_at,
                  html_url,
                  current_or_failed_step: ([.steps[]? | select(.status != "completed" or .conclusion == "failure")][0] // null)
                }
              ],
              recent_runs: [
                $recent.workflow_runs[] | {
                  id,
                  name,
                  path,
                  head_sha,
                  event,
                  status,
                  conclusion,
                  created_at,
                  updated_at,
                  run_started_at,
                  html_url,
                  attempt: .run_attempt
                }
              ]
            }' > .github/release-status/redroid-active-run.json

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/release-status/redroid-active-run.json
          git commit -m "Record active Redroid ARM64 run" || exit 0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          exit 1
