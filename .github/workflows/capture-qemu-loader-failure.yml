name: Capture QEMU loader-fix failure

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-qemu-loader-failure.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture failed log tail
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: "29972183842"
        run: |
          set -euo pipefail
          mkdir -p .github/release-status
          {
            echo "failed_run_id=$FAILED_RUN_ID"
            gh run view "$FAILED_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed || true
          } | tail -n 500 > .github/release-status/redroid-qemu-loader-failure.log
          git fetch origin main
          git checkout -B main origin/main
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/release-status/redroid-qemu-loader-failure.log
          git commit -m "Capture QEMU loader-fix failed step" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
