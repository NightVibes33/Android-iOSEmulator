name: Capture QEMU loader-fix failure

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-qemu-loader-failure.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture failed job log tail
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: "29972384284"
          FAILED_JOB_ID: "89097005573"
        run: |
          set -euo pipefail
          mkdir -p .github/release-status
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$FAILED_JOB_ID/logs" \
            -o /tmp/job-logs
          {
            echo "failed_run_id=$FAILED_RUN_ID"
            echo "failed_job_id=$FAILED_JOB_ID"
            if file /tmp/job-logs | grep -qi zip; then
              unzip -p /tmp/job-logs
            else
              cat /tmp/job-logs
            fi
          } | tail -n 500 > .github/release-status/redroid-qemu-loader-failure.log
          git fetch origin main
          git checkout -B main origin/main
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/release-status/redroid-qemu-loader-failure.log
          git commit -m "Capture QEMU loader-fix failed step" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
