name: Build matching LiveContainer serial signer

on:
  push:
    branches: [main]
    paths:
      - ".github/release-request/livecontainer-serial-signer.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: livecontainer-serial-signer-release
  cancel-in-progress: true

env:
  UPSTREAM_REPOSITORY: LiveContainer/LiveContainer
  UPSTREAM_REF: "2afc9c38ea82e45d1cab1e75dc68e4b14c2fbf2b"
  RELEASE_TAG: livecontainer-serial-signer-2afc9c3-v1
  TAG_TARGET_COMMIT: 99ebff326f89d945573965b1decf700c5ebc7f7e
  IPA_NAME: LiveContainer-SerialSigner-2afc9c3.ipa

jobs:
  build:
    name: Build and publish serial-signing LiveContainer
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout Android iOSEmulator repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)"
          test -n "$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Clone matching official LiveContainer source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout \
            "https://github.com/$UPSTREAM_REPOSITORY.git" upstream-livecontainer
          git -C upstream-livecontainer fetch --depth 1 origin "$UPSTREAM_REF"
          git -C upstream-livecontainer checkout --detach FETCH_HEAD
          git -C upstream-livecontainer submodule update --init --recursive --depth 1
          test "$(git -C upstream-livecontainer rev-parse HEAD)" = "$UPSTREAM_REF"
          git -C upstream-livecontainer rev-parse HEAD > upstream-livecontainer-commit.txt
          test -f upstream-livecontainer/ZSign/zsign.mm

      - name: Serialize Mach-O signing and add build marker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("upstream-livecontainer/ZSign/zsign.mm")
          text = path.read_text()
          old = 'dispatch_queue_t concurrentQueue = dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_DEFAULT, 0);'
          new = 'dispatch_queue_t concurrentQueue = dispatch_queue_create("com.nightvibes33.livecontainer.serial-macho-signing", DISPATCH_QUEUE_SERIAL);'
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one signer queue marker, found {text.count(old)}")
          patched = text.replace(old, new, 1)
          if old in patched or patched.count(new) != 1:
              raise SystemExit("serial signer source replacement did not validate")
          path.write_text(patched)
          PY

          grep -Fq 'com.nightvibes33.livecontainer.serial-macho-signing' \
            upstream-livecontainer/ZSign/zsign.mm
          ! grep -Fq 'dispatch_queue_t concurrentQueue = dispatch_get_global_queue' \
            upstream-livecontainer/ZSign/zsign.mm
          shasum -a 256 upstream-livecontainer/ZSign/zsign.mm > patched-zsign.mm.sha256

      - name: Archive unsigned LiveContainer
        shell: bash
        working-directory: upstream-livecontainer
        run: |
          set -euo pipefail
          SCHEME=LiveContainer
          ARCHIVE_PATH="$PWD/archive"
          WORKSPACE="$(find . -maxdepth 1 -type d -name '*.xcworkspace' -print -quit | sed 's#^./##')"
          PROJECT="$(find . -maxdepth 1 -type d -name '*.xcodeproj' -print -quit | sed 's#^./##')"
          if [[ -n "$WORKSPACE" ]]; then
            BUILD_KIND=workspace
            BUILD_FILE="$WORKSPACE"
          else
            test -n "$PROJECT"
            BUILD_KIND=project
            BUILD_FILE="$PROJECT"
          fi
          echo "Building -$BUILD_KIND $BUILD_FILE"

          xcodebuild archive \
            -archivePath "$ARCHIVE_PATH" \
            -scheme "$SCHEME" \
            -"$BUILD_KIND" "$BUILD_FILE" \
            -sdk iphoneos \
            -arch arm64 \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

          test -d "$ARCHIVE_PATH.xcarchive/Products/Applications/LiveContainer.app"

      - name: Package standalone serial-signing IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package extracted
          mkdir -p package/Payload extracted
          cp -R upstream-livecontainer/archive.xcarchive/Products/Applications/LiveContainer.app \
            package/Payload/LiveContainer.app

          APP=package/Payload/LiveContainer.app
          INFO="$APP/Info.plist"
          test -f "$INFO"

          rm -rf "$APP/Frameworks/SideStore.framework"
          find "$APP" -name _CodeSignature -type d -prune -exec rm -rf {} +
          find "$APP" -name embedded.mobileprovision -type f -delete
          xattr -cr "$APP"

          /usr/libexec/PlistBuddy -c 'Delete :LCSerialMachOSigning' "$INFO" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c 'Add :LCSerialMachOSigning bool true' "$INFO"
          /usr/libexec/PlistBuddy -c 'Delete :LCSerialSignerBuild' "$INFO" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c 'Add :LCSerialSignerBuild string NightVibes33-2afc9c3-v1' "$INFO"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName LiveContainer Serial' "$INFO" || \
            /usr/libexec/PlistBuddy -c 'Add :CFBundleDisplayName string LiveContainer Serial' "$INFO"
          plutil -lint "$INFO"

          MAIN_EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO")"
          test -f "$APP/$MAIN_EXECUTABLE"
          file "$APP/$MAIN_EXECUTABLE" | grep -Fq 'Mach-O 64-bit executable arm64'

          (
            cd package
            /usr/bin/zip -qry -y "../$IPA_NAME" Payload
          )

          unzip -t "$IPA_NAME" >/dev/null
          unzip -q "$IPA_NAME" -d extracted
          EXTRACTED_INFO=extracted/Payload/LiveContainer.app/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :LCSerialMachOSigning' "$EXTRACTED_INFO")" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print :LCSerialSignerBuild' "$EXTRACTED_INFO")" = NightVibes33-2afc9c3-v1
          EXTRACTED_EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$EXTRACTED_INFO")"
          test -f "extracted/Payload/LiveContainer.app/$EXTRACTED_EXECUTABLE"
          file "extracted/Payload/LiveContainer.app/$EXTRACTED_EXECUTABLE" | grep -Fq 'Mach-O 64-bit executable arm64'

          shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256"
          stat -f%z "$IPA_NAME" > "$IPA_NAME.size"
          {
            echo 'Upstream: LiveContainer/LiveContainer'
            echo "Upstream ref: $UPSTREAM_REF"
            echo "Upstream commit: $(cat upstream-livecontainer-commit.txt)"
            echo 'Patch: Mach-O signing queue changed from global concurrent to serial'
            echo 'Source replacement validation: passed'
            echo 'Bundle marker: LCSerialMachOSigning=true'
            echo 'Bundle marker: LCSerialSignerBuild=NightVibes33-2afc9c3-v1'
            echo "Package commit: $GITHUB_SHA"
          } > LiveContainer-SerialSigner-build-manifest.txt

      - name: Upload complete serial-signer IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-SerialSigner-2afc9c3
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.IPA_NAME }}.sha256
            ${{ env.IPA_NAME }}.size
            LiveContainer-SerialSigner-build-manifest.txt
            upstream-livecontainer-commit.txt
            patched-zsign.mm.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish companion release using built-in token
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SIZE="$(cat "$IPA_NAME.size")"

          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag >/dev/null 2>&1 || true
          git push origin ":refs/tags/$RELEASE_TAG" >/dev/null 2>&1 || true
          git tag -d "$RELEASE_TAG" >/dev/null 2>&1 || true
          git tag "$RELEASE_TAG" "$TAG_TARGET_COMMIT"
          git push origin "refs/tags/$RELEASE_TAG"

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "LiveContainer — Serial Mach-O signer (2afc9c3)" \
            --notes "Companion host for Android iOSEmulator. Built from official LiveContainer commit 2afc9c38ea82e45d1cab1e75dc68e4b14c2fbf2b, which matches the signer producing the reported Invalid mach-o file and Failed to Sign messages. The signer queue is changed from concurrent to serial so large apps are copied, mapped, and signed one Mach-O at a time. Install using the same certificate, then delete and freshly reimport Android iOSEmulator v0.4.2." \
            --prerelease
          gh release upload "$RELEASE_TAG" \
            "$IPA_NAME" "$IPA_NAME.sha256" LiveContainer-SerialSigner-build-manifest.txt patched-zsign.mm.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber

          RELEASE_JSON="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,assets,isPrerelease)"
          test "$(jq -r '.isPrerelease' <<<"$RELEASE_JSON")" = true
          test "$(jq -r --arg name "$IPA_NAME" '.assets[] | select(.name==$name) | .size' <<<"$RELEASE_JSON")" = "$SIZE"
          echo "$RELEASE_JSON" > serial-signer-release.json

      - name: Record verified serial-signer release
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_URL="$(jq -r .url serial-signer-release.json)"
          SIZE="$(cat "$IPA_NAME.size")"
          SHA256="$(awk '{print $1}' "$IPA_NAME.sha256")"
          SOURCE_PATCH_SHA256="$(awk '{print $1}' patched-zsign.mm.sha256)"
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .github/release-status
          jq -n \
            --arg release_url "$RELEASE_URL" \
            --arg tag "$RELEASE_TAG" \
            --arg asset_name "$IPA_NAME" \
            --arg asset_sha256 "$SHA256" \
            --arg source_patch_sha256 "$SOURCE_PATCH_SHA256" \
            --arg upstream_ref "$UPSTREAM_REF" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --arg package_commit "$GITHUB_SHA" \
            --argjson asset_size_bytes "$SIZE" \
            '{verified:true,product:"LiveContainer serial-signing companion",upstream_ref:$upstream_ref,serial_macho_signing:true,source_replacement_verified:true,source_patch_sha256:$source_patch_sha256,bundle_marker:"NightVibes33-2afc9c3-v1",tag:$tag,release_url:$release_url,asset_name:$asset_name,asset_size_bytes:$asset_size_bytes,asset_sha256:$asset_sha256,workflow_run_id:$workflow_run_id,package_commit:$package_commit}' \
            > .github/release-status/livecontainer-serial-signer.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/release-status/livecontainer-serial-signer.json
          git commit -m "Record verified LiveContainer serial signer" || true
          git pull --rebase origin main
          git push origin HEAD:main
