name: Build full LiveContainer Android IPA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/build_livecontainer_utm_se.sh"
      - ".github/workflows/build-full-livecontainer-android.yml"
      - "docs/FULL_LIVECONTAINER_BUILD.md"
  push:
    branches:
      - main
    paths:
      - "scripts/build_livecontainer_utm_se.sh"
      - ".github/workflows/build-full-livecontainer-android.yml"
      - "docs/FULL_LIVECONTAINER_BUILD.md"

permissions:
  contents: read

concurrency:
  group: full-livecontainer-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: LiveContainer UI + UTM SE runtime
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout Android iOSEmulator
        uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)"
          if [[ -z "$XCODE_PATH" ]]; then
            echo "No Xcode 26 installation was found." >&2
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Build full unsigned IPA
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/full-livecontainer
          bash -x ./scripts/build_livecontainer_utm_se.sh 2>&1 | tee build/full-livecontainer/full-build.log

      - name: Verify LiveContainer frontend and embedded UTM SE
        shell: bash
        run: |
          set -euo pipefail
          IPA="build/full-livecontainer/Android-iOSEmulator-LiveContainer-UTM-SE-unsigned.ipa"
          test -f "$IPA"
          unzip -t "$IPA" >/dev/null
          unzip -l "$IPA" | tee build/full-livecontainer/verified-contents.txt
          grep -q 'Payload/Android iOSEmulator.app/PreloadedApps/UTM SE.app/' build/full-livecontainer/verified-contents.txt
          grep -q 'LiveContainer' build/full-livecontainer/xcodebuild.log
          if grep -Eq '(_CodeSignature|embedded.mobileprovision)' build/full-livecontainer/verified-contents.txt; then
            echo "Signing artifacts found in unsigned IPA." >&2
            exit 1
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-iOSEmulator-LiveContainer-build-diagnostics
          path: |
            build/full-livecontainer/full-build.log
            build/full-livecontainer/xcodebuild.log
            build/full-livecontainer/ipa-contents.txt
            build/full-livecontainer/verified-contents.txt
            build/full-livecontainer/build-manifest.txt
          if-no-files-found: warn

      - name: Upload full unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Android-iOSEmulator-LiveContainer-UTM-SE-unsigned
          path: |
            build/full-livecontainer/Android-iOSEmulator-LiveContainer-UTM-SE-unsigned.ipa
            build/full-livecontainer/Android-iOSEmulator-LiveContainer-UTM-SE-unsigned.ipa.sha256
            build/full-livecontainer/build-manifest.txt
          if-no-files-found: error
