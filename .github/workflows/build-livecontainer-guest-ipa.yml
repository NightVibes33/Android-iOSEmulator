name: Build preinstalled Android 13 LiveContainer guest

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "runtime/livecontainer-guest/**"
      - "scripts/build_bliss_android13_disk.sh"
      - "scripts/build_livecontainer_guest_ipa.sh"
      - "scripts/make_bliss_android13_utm.py"
      - ".github/workflows/build-livecontainer-guest-ipa.yml"
  push:
    branches: [main]
    paths:
      - "runtime/livecontainer-guest/**"
      - "scripts/build_bliss_android13_disk.sh"
      - "scripts/build_livecontainer_guest_ipa.sh"
      - "scripts/make_bliss_android13_utm.py"
      - ".github/workflows/build-livecontainer-guest-ipa.yml"

permissions:
  contents: write

concurrency:
  group: livecontainer-android13-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Import-safe UTM SE + preinstalled BlissOS Android 13
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)"
          test -n "$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Install Android disk build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install qemu sevenzip mtools e2fsprogs gptfdisk
          echo "$(brew --prefix e2fsprogs)/sbin" >> "$GITHUB_PATH"
          qemu-img --version
          7zz --help >/dev/null
          mformat -V
          sgdisk --version
          "$(brew --prefix e2fsprogs)/sbin/mkfs.ext4" -V

      - name: Build import-safe Android 13 guest IPA
        shell: bash
        run: |
          set -o pipefail
          rm -f livecontainer-android13-build.log
          bash -x ./scripts/build_livecontainer_guest_ipa.sh 2>&1 | tee livecontainer-android13-build.log

      - name: Verify final IPA exactly as LiveContainer imports it
        shell: bash
        run: |
          set -euo pipefail
          OUT="build/livecontainer-guest"
          IPA="$OUT/Android-iOSEmulator-Android13-Preinstalled-LiveContainer-Guest-unsigned.ipa"
          test -f "$IPA"
          unzip -t "$IPA" >/dev/null
          unzip -Z1 "$IPA" | tee "$OUT/verified-contents.txt"
          test "$(grep -Ec '^Payload/[^/]+\.app/$' "$OUT/archive-entry-order.txt")" -eq 1
          test "$(sed -n '1p' "$OUT/archive-entry-order.txt")" = 'Payload/'
          test "$(sed -n '2p' "$OUT/archive-entry-order.txt")" = 'Payload/Android iOSEmulator.app/'
          test "$(sed -n '3p' "$OUT/archive-entry-order.txt")" = 'Payload/Android iOSEmulator.app/Info.plist'
          test "$(sed -n '4p' "$OUT/archive-entry-order.txt")" = 'Payload/Android iOSEmulator.app/UTM SE'
          test "$(sed -n '5p' "$OUT/archive-entry-order.txt")" = 'Payload/Android iOSEmulator.app/LCAppInfo.plist'
          tail -n 1 "$OUT/archive-entry-order.txt" | grep -q 'Payload/Android iOSEmulator.app/PreloadedData/Android.utm/Images/bliss-android13-preinstalled.qcow2'
          ! unzip -Z1 "$IPA" | grep -q 'PreloadedApps/'
          ! unzip -Z1 "$IPA" | grep -Eq '^Payload/[^/]+\.app/.+\.app/'
          ! unzip -Z1 "$IPA" | grep -q '\.iso$'
          grep -q 'Payload/Android iOSEmulator.app/LCAppInfo.plist' "$OUT/verified-contents.txt"
          grep -q 'Payload/Android iOSEmulator.app/BootstrapTweaks/AndroidGuestBootstrap.dylib' "$OUT/verified-contents.txt"
          grep -q 'Payload/Android iOSEmulator.app/PreloadedData/Android.utm/config.plist' "$OUT/verified-contents.txt"
          grep -q 'Payload/Android iOSEmulator.app/PreloadedData/Android.utm/Images/bliss-android13-preinstalled.qcow2' "$OUT/verified-contents.txt"
          grep -q 'Payload/Android iOSEmulator.app/Frameworks/qemu-m68k-softmmu.framework/' "$OUT/verified-contents.txt"
          grep -q 'Payload/Android iOSEmulator.app/Frameworks/qemu-x86_64-softmmu.framework/' "$OUT/verified-contents.txt"
          ! grep -Eq 'qemu-(aarch64|i386|ppc|ppc64|riscv64)-softmmu\.framework/' "$OUT/verified-contents.txt"
          grep -q '@rpath/qemu-m68k-softmmu.framework/qemu-m68k-softmmu' "$OUT/utm-executable-dependencies.txt"
          grep -q '^bundleIdentifier=com.nightvibes33.androidiosemulator.livecontainer$' "$OUT/livecontainer-import-metadata.txt"
          grep -q '^executable=UTM SE$' "$OUT/livecontainer-import-metadata.txt"
          grep -q 'LiveContainer import metadata: extracted and parsed from final IPA' "$OUT/build-manifest.txt"
          grep -q 'Unknown.app fallback: blocked by post-archive bundle identifier and executable checks' "$OUT/build-manifest.txt"
          grep -q 'Release delivery: one complete IPA asset; split parts forbidden' "$OUT/build-manifest.txt"
          SIZE="$(stat -f%z "$IPA")"
          test "$SIZE" -lt 2147483648

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android13-LiveContainer-Import-Fix-diagnostics
          path: |
            livecontainer-android13-build.log
            build/livecontainer-guest/ipa-contents.txt
            build/livecontainer-guest/verified-contents.txt
            build/livecontainer-guest/archive-entry-order.txt
            build/livecontainer-guest/livecontainer-import-metadata.txt
            build/livecontainer-guest/build-manifest.txt
            build/livecontainer-guest/utm-executable-dependencies.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload complete Android 13 IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-iOSEmulator-Android13-Preinstalled-LiveContainer-Guest-unsigned
          path: |
            build/livecontainer-guest/Android-iOSEmulator-Android13-Preinstalled-LiveContainer-Guest-unsigned.ipa
            build/livecontainer-guest/Android-iOSEmulator-Android13-Preinstalled-LiveContainer-Guest-unsigned.ipa.sha256
            build/livecontainer-guest/build-manifest.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish LiveContainer import-fix Android 13 prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.2.3-android13-livecontainer-import-fix
          BROKEN_TAG: v0.2.2-android13-dyld-fix
        run: |
          set -euo pipefail
          OUT="build/livecontainer-guest"
          IPA="$OUT/Android-iOSEmulator-Android13-Preinstalled-LiveContainer-Guest-unsigned.ipa"
          SIZE="$(stat -f%z "$IPA")"
          test "$SIZE" -lt 2147483648
          grep -q '^bundleIdentifier=com.nightvibes33.androidiosemulator.livecontainer$' "$OUT/livecontainer-import-metadata.txt"
          grep -q '^executable=UTM SE$' "$OUT/livecontainer-import-metadata.txt"

          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" "$IPA" \
            --target "$GITHUB_SHA" \
            --title "Android iOSEmulator — LiveContainer import fix" \
            --notes "One complete unsigned LiveContainer guest IPA. Fixes the Unknown.app/(null) import failure by placing Info.plist, the UTM SE executable, and LCAppInfo.plist at the beginning of the archive and validating those files after extraction from the final IPA. qemu-m68k-softmmu and qemu-x86_64-softmmu remain present. BlissOS 16 / Android 13 is preinstalled; no installer ISO, debug shell, or split files are used. Delete the previous app entry from LiveContainer before importing this build so stale Unknown.app metadata is removed." \
            --prerelease

          RELEASE_JSON="$(gh release view "$TAG" --json assets,isPrerelease)"
          test "$(jq '.assets | length' <<<"$RELEASE_JSON")" -eq 1
          test "$(jq -r '.assets[0].name' <<<"$RELEASE_JSON")" = "$(basename "$IPA")"
          test "$(jq '.assets[0].size' <<<"$RELEASE_JSON")" -eq "$SIZE"
          test "$(jq -r '.isPrerelease' <<<"$RELEASE_JSON")" = "true"

          gh release delete "$BROKEN_TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
