name: Build preinstalled Android 13 LiveContainer guest

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "runtime/livecontainer-guest/**"
      - "scripts/build_bliss_android13_disk.sh"
      - "scripts/build_livecontainer_guest_ipa.sh"
      - "scripts/make_bliss_android13_utm.py"
      - ".github/workflows/build-livecontainer-guest-ipa.yml"
  push:
    branches: [main]
    paths:
      - "runtime/livecontainer-guest/**"
      - "scripts/build_bliss_android13_disk.sh"
      - "scripts/build_livecontainer_guest_ipa.sh"
      - "scripts/make_bliss_android13_utm.py"
      - ".github/workflows/build-livecontainer-guest-ipa.yml"

permissions:
  contents: write

concurrency:
  group: livecontainer-android13-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: UTM SE + preinstalled BlissOS Android 13
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)"
          test -n "$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Install Android disk build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install qemu sevenzip mtools e2fsprogs gptfdisk
          echo "$(brew --prefix e2fsprogs)/sbin" >> "$GITHUB_PATH"
          qemu-img --version
          7zz --help >/dev/null
          mformat -V
          sgdisk --version
          "$(brew --prefix e2fsprogs)/sbin/mkfs.ext4" -V

      - name: Build unsigned preinstalled Android 13 guest IPA
        shell: bash
        run: |
          set -o pipefail
          rm -f livecontainer-android13-build.log
          bash -x ./scripts/build_livecontainer_guest_ipa.sh 2>&1 | tee livecontainer-android13-build.log

      - name: Verify preinstalled guest-only package
        shell: bash
        run: |
          set -euo pipefail
          OUT="build/livecontainer-guest"
          IPA="$OUT/Android-iOSEmulator-Android13-Preinstalled-LiveContainer-Guest-unsigned.ipa"
          test -f "$IPA"
          unzip -t "$IPA" >/dev/null
          unzip -Z1 "$IPA" | tee "$OUT/verified-contents.txt"
          test "$(unzip -Z1 "$IPA" | grep -Ec '^Payload/[^/]+\.app/$')" -eq 1
          ! unzip -Z1 "$IPA" | grep -q 'PreloadedApps/'
          ! unzip -Z1 "$IPA" | grep -Eq '^Payload/[^/]+\.app/.+\.app/'
          ! unzip -Z1 "$IPA" | grep -q '\.iso$'
          grep -q 'Payload/Android iOSEmulator.app/LCAppInfo.plist' "$OUT/verified-contents.txt"
          grep -q 'Payload/Android iOSEmulator.app/BootstrapTweaks/AndroidGuestBootstrap.dylib' "$OUT/verified-contents.txt"
          grep -q 'Payload/Android iOSEmulator.app/PreloadedData/Android.utm/config.plist' "$OUT/verified-contents.txt"
          grep -q 'Payload/Android iOSEmulator.app/PreloadedData/Android.utm/Images/bliss-android13-preinstalled.qcow2' "$OUT/verified-contents.txt"
          grep -q 'Android guest: BlissOS 16.9.7 / Android 13 x86_64' "$OUT/build-manifest.txt"
          grep -q 'Android state: preinstalled persistent disk' "$OUT/build-manifest.txt"
          grep -q 'Installer ISO: absent' "$OUT/build-manifest.txt"
          grep -q 'Debug console boot: disabled' "$OUT/build-manifest.txt"

      - name: Prepare release-size parts
        shell: bash
        run: |
          set -euo pipefail
          OUT="build/livecontainer-guest"
          IPA="$OUT/Android-iOSEmulator-Android13-Preinstalled-LiveContainer-Guest-unsigned.ipa"
          PARTS="$OUT/parts"
          mkdir -p "$PARTS"
          split -b 1900m -d -a 2 "$IPA" "$PARTS/Android-iOSEmulator-Android13-Preinstalled-LiveContainer-Guest-unsigned.ipa.part-"
          test "$(find "$PARTS" -type f -name '*.part-*' | wc -l | tr -d ' ')" -le 5
          shasum -a 256 "$PARTS"/*.part-* > "$PARTS/parts.sha256"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android13-Preinstalled-LiveContainer-Guest-diagnostics
          path: |
            livecontainer-android13-build.log
            build/livecontainer-guest/ipa-contents.txt
            build/livecontainer-guest/verified-contents.txt
            build/livecontainer-guest/build-manifest.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload full Android 13 guest IPA
        uses: actions/upload-artifact@v4
        with:
          name: Android-iOSEmulator-Android13-Preinstalled-LiveContainer-Guest-unsigned
          path: |
            build/livecontainer-guest/Android-iOSEmulator-Android13-Preinstalled-LiveContainer-Guest-unsigned.ipa
            build/livecontainer-guest/Android-iOSEmulator-Android13-Preinstalled-LiveContainer-Guest-unsigned.ipa.sha256
            build/livecontainer-guest/build-manifest.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload release-size parts
        uses: actions/upload-artifact@v4
        with:
          name: Android-iOSEmulator-Android13-Preinstalled-LiveContainer-Guest-parts
          path: |
            build/livecontainer-guest/parts/*
            build/livecontainer-guest/Android-iOSEmulator-Android13-Preinstalled-LiveContainer-Guest-unsigned.ipa.sha256
            build/livecontainer-guest/build-manifest.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish Android 13 prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.2.0-android13-preinstalled
        run: |
          set -euo pipefail
          OUT="build/livecontainer-guest"
          IPA="$OUT/Android-iOSEmulator-Android13-Preinstalled-LiveContainer-Guest-unsigned.ipa"
          LIMIT=2000000000
          SIZE="$(stat -f%z "$IPA")"
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          if (( SIZE <= LIMIT )); then
            gh release create "$TAG" \
              "$IPA" \
              "$IPA.sha256" \
              "$OUT/build-manifest.txt" \
              --target "$GITHUB_SHA" \
              --title "Android iOSEmulator — preinstalled Android 13" \
              --notes "BlissOS 16 / Android 13 is already installed on the bundled persistent disk. Opening the guest boots from disk with a zero-second GRUB entry; there is no installer ISO and no debug-console boot. This remains an unsigned LiveContainer guest and physical-device graphical boot still requires validation." \
              --prerelease
          else
            gh release create "$TAG" \
              "$OUT"/parts/*.part-* \
              "$OUT/parts/parts.sha256" \
              "$IPA.sha256" \
              "$OUT/build-manifest.txt" \
              --target "$GITHUB_SHA" \
              --title "Android iOSEmulator — preinstalled Android 13" \
              --notes "The complete IPA exceeds GitHub's single-release-asset limit. Download all ordered .part files and concatenate them to reconstruct the IPA. The workflow artifact also contains the complete IPA. BlissOS 16 / Android 13 is already installed; no installer ISO or debug-console boot is included. Physical-device graphical boot still requires validation." \
              --prerelease
          fi
