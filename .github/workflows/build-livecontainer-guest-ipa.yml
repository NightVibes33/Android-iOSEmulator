name: Retired BlissOS x86_64 experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain retired build lane
        shell: bash
        run: |
          cat <<'EOF'
          This x86_64 BlissOS/UTM SE build lane is retired.

          It proved LiveContainer import and packaging behavior, but it did not
          prove a usable Android graphical boot on ARM iPhone hardware. It no
          longer builds artifacts or publishes releases.

          Use .github/workflows/build-arm64-fvp-livecontainer-ipa.yml with a
          verified official AOSP FVP ARM64 product-output archive.
          EOF
