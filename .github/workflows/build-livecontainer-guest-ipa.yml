name: Build LiveContainer guest Android IPA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "runtime/livecontainer-guest/**"
      - "scripts/build_livecontainer_guest_ipa.sh"
      - "scripts/make_android_x86_utm.py"
      - ".github/workflows/build-livecontainer-guest-ipa.yml"
  push:
    branches: [main]
    paths:
      - "runtime/livecontainer-guest/**"
      - "scripts/build_livecontainer_guest_ipa.sh"
      - "scripts/make_android_x86_utm.py"
      - ".github/workflows/build-livecontainer-guest-ipa.yml"

permissions:
  contents: write

concurrency:
  group: livecontainer-guest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: UTM SE root guest + Android VM
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)"
          test -n "$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Install qemu-img
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v qemu-img >/dev/null 2>&1; then
            brew install qemu
          fi
          qemu-img --version

      - name: Build unsigned LiveContainer guest IPA
        shell: bash
        run: |
          set -o pipefail
          rm -f livecontainer-guest-build.log
          bash -x ./scripts/build_livecontainer_guest_ipa.sh 2>&1 | tee livecontainer-guest-build.log

      - name: Verify guest-only package
        shell: bash
        run: |
          set -euo pipefail
          OUT="build/livecontainer-guest"
          IPA="$OUT/Android-iOSEmulator-LiveContainer-Guest-unsigned.ipa"
          test -f "$IPA"
          unzip -t "$IPA" >/dev/null
          unzip -Z1 "$IPA" | tee "$OUT/verified-contents.txt"
          test "$(unzip -Z1 "$IPA" | grep -Ec '^Payload/[^/]+\.app/$')" -eq 1
          ! unzip -Z1 "$IPA" | grep -q 'PreloadedApps/'
          ! unzip -Z1 "$IPA" | grep -Eq '^Payload/[^/]+\.app/.+\.app/'
          grep -q 'Payload/Android iOSEmulator.app/LCAppInfo.plist' "$OUT/verified-contents.txt"
          grep -q 'Payload/Android iOSEmulator.app/BootstrapTweaks/AndroidGuestBootstrap.dylib' "$OUT/verified-contents.txt"
          grep -q 'Payload/Android iOSEmulator.app/PreloadedData/Android.utm/config.plist' "$OUT/verified-contents.txt"
          grep -q 'Package type: LiveContainer guest IPA' "$OUT/build-manifest.txt"
          grep -q 'Nested LiveContainer host: absent' "$OUT/build-manifest.txt"

      - name: Split IPA for bridge verification
        shell: bash
        run: |
          set -euo pipefail
          OUT="build/livecontainer-guest"
          IPA="$OUT/Android-iOSEmulator-LiveContainer-Guest-unsigned.ipa"
          PARTS="$OUT/parts"
          mkdir -p "$PARTS"
          split -b 300m -d -a 2 "$IPA" "$PARTS/Android-iOSEmulator-LiveContainer-Guest-unsigned.ipa.part-"
          test "$(find "$PARTS" -type f -name '*.part-*' | wc -l | tr -d ' ')" -le 5
          shasum -a 256 "$PARTS"/*.part-* > "$PARTS/parts.sha256"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-iOSEmulator-LiveContainer-Guest-diagnostics
          path: |
            livecontainer-guest-build.log
            build/livecontainer-guest/ipa-contents.txt
            build/livecontainer-guest/verified-contents.txt
            build/livecontainer-guest/build-manifest.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload full guest IPA
        uses: actions/upload-artifact@v4
        with:
          name: Android-iOSEmulator-LiveContainer-Guest-unsigned
          path: |
            build/livecontainer-guest/Android-iOSEmulator-LiveContainer-Guest-unsigned.ipa
            build/livecontainer-guest/Android-iOSEmulator-LiveContainer-Guest-unsigned.ipa.sha256
            build/livecontainer-guest/build-manifest.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload bridge parts
        uses: actions/upload-artifact@v4
        with:
          name: Android-iOSEmulator-LiveContainer-Guest-parts
          path: |
            build/livecontainer-guest/parts/*
            build/livecontainer-guest/Android-iOSEmulator-LiveContainer-Guest-unsigned.ipa.sha256
            build/livecontainer-guest/build-manifest.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish IPA-only prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.1-livecontainer-guest
        run: |
          set -euo pipefail
          IPA="build/livecontainer-guest/Android-iOSEmulator-LiveContainer-Guest-unsigned.ipa"
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" "$IPA" \
            --target "$GITHUB_SHA" \
            --title "Android iOSEmulator LiveContainer Guest v0.1.1" \
            --notes "Guest-only build for importing into the official LiveContainer. The top-level app is UTM SE with the Android VM bundled directly; there is no nested LiveContainer host. Requires LiveContainer JITLess configuration on iOS 26 or newer. Physical Android graphical boot remains under device validation." \
            --prerelease
          test "$(gh release view "$TAG" --json assets --jq '.assets | length')" -eq 1
          test "$(gh release view "$TAG" --json assets --jq '.assets[0].name')" = "Android-iOSEmulator-LiveContainer-Guest-unsigned.ipa"
