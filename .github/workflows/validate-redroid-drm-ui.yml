name: Validate ARM64 Redroid DRM and UI bridge

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Workflow run containing the verified redroid-arm64-guest artifact
        required: true
        default: "29949669780"
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-redroid-drm-ui.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: redroid-arm64-drm-ui-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_SOURCE_RUN_ID: "29949669780"

jobs:
  validate-drm-ui:
    name: Prove VirtIO DRM, Weston and scrcpy
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM64 display-test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm adb zstd
          uname -m | grep -qx aarch64
          qemu-system-aarch64 --version
          gh --version

      - name: Download previously boot-verified ARM64 guest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          SOURCE_RUN_ID="${INPUT_SOURCE_RUN_ID:-$DEFAULT_SOURCE_RUN_ID}"
          mkdir -p .downloaded-redroid-guest
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name redroid-arm64-guest \
            --dir .downloaded-redroid-guest
          ARCHIVE="$(find .downloaded-redroid-guest -type f -name 'redroid-arm64-guest.tar.zst' -print -quit)"
          test -n "$ARCHIVE"
          mkdir -p build/redroid-drm-ui-guest
          zstd -d --stdout "$ARCHIVE" | tar --sparse -xf - -C build/redroid-drm-ui-guest
          grep -q '^CI Android boot verification: passed$' build/redroid-drm-ui-guest/build-manifest.txt
          grep -q '^CI Android sys.boot_completed: 1$' build/redroid-drm-ui-guest/build-manifest.txt
          echo "SOURCE_RUN_ID=$SOURCE_RUN_ID" >> "$GITHUB_ENV"

      - name: Boot with the exact UTM VirtIO display device
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/redroid-drm-ui-guest
          ROOT_DISK="$OUT/redroid-arm64-rootfs.raw"
          QEMU_LOG=qemu-arm64-drm-ui.log
          rm -f "$QEMU_LOG" android-ui-status.txt android-ui-journal.txt android-drm-state.txt

          adb kill-server >/dev/null 2>&1 || true
          adb start-server

          timeout --signal=TERM --kill-after=30s 55m \
            qemu-system-aarch64 \
              -machine virt,highmem=off \
              -accel tcg,thread=multi \
              -cpu max \
              -smp 2 \
              -m 2048 \
              -kernel "$OUT/kernel" \
              -initrd "$OUT/initrd.img" \
              -append 'root=/dev/vda rw rootwait rootfstype=ext4 console=ttyAMA0 earlycon=pl011,0x09000000 systemd.show_status=auto systemd.log_target=console loglevel=4' \
              -drive "if=none,file=$ROOT_DISK,format=raw,id=rootfs,cache=unsafe" \
              -device virtio-blk-pci,drive=rootfs \
              -netdev user,id=net0,hostfwd=tcp:127.0.0.1:5555-:5555 \
              -device virtio-net-pci,netdev=net0,romfile= \
              -device virtio-gpu-pci \
              -device virtio-keyboard-pci \
              -device virtio-tablet-pci \
              -device virtio-rng-pci \
              -display none \
              -monitor none \
              -serial stdio \
              -snapshot \
              -no-reboot >>"$QEMU_LOG" 2>&1 &
          QEMU_WRAPPER_PID=$!
          cleanup() {
            kill "$QEMU_WRAPPER_PID" >/dev/null 2>&1 || true
            wait "$QEMU_WRAPPER_PID" >/dev/null 2>&1 || true
            adb disconnect 127.0.0.1:5555 >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          BOOTED=0
          for _ in $(seq 1 1800); do
            adb connect 127.0.0.1:5555 >/dev/null 2>&1 || true
            if [[ "$(adb -s 127.0.0.1:5555 get-state 2>/dev/null || true)" == device ]] &&
               [[ "$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" == 1 ]]; then
              BOOTED=1
              break
            fi
            kill -0 "$QEMU_WRAPPER_PID" 2>/dev/null || break
            sleep 1
          done
          [[ "$BOOTED" -eq 1 ]]

          adb -s 127.0.0.1:5555 shell 'test -c /dev/dri/card0'
          adb -s 127.0.0.1:5555 shell 'test -d /run/weston && test -S /run/weston/wayland-0'

          UI_READY=0
          for _ in $(seq 1 180); do
            if adb -s 127.0.0.1:5555 shell \
              'systemctl is-active --quiet weston-redroid.service && systemctl is-active --quiet redroid-ui.service && pgrep -x weston >/dev/null && pgrep -x scrcpy >/dev/null'; then
              UI_READY=1
              break
            fi
            sleep 1
          done

          adb -s 127.0.0.1:5555 shell \
            'systemctl status --no-pager weston-redroid.service redroid-ui.service; ps -ef | grep -E "weston|scrcpy" | grep -v grep' \
            > android-ui-status.txt 2>&1 || true
          adb -s 127.0.0.1:5555 shell \
            'journalctl -b --no-pager -u weston-redroid.service -u redroid-ui.service' \
            > android-ui-journal.txt 2>&1 || true
          adb -s 127.0.0.1:5555 shell \
            'ls -l /dev/dri; cat /sys/class/drm/card0/device/uevent 2>/dev/null || true; dmesg | grep -Ei "drm|virtio_gpu|virtio-gpu" | tail -n 200' \
            > android-drm-state.txt 2>&1 || true

          if [[ "$UI_READY" -ne 1 ]]; then
            tail -n 300 "$QEMU_LOG" || true
            cat android-ui-status.txt || true
            cat android-ui-journal.txt || true
            cat android-drm-state.txt || true
            exit 1
          fi

          cat > redroid-drm-ui-verification.txt <<EOF
          source_run_id=$SOURCE_RUN_ID
          guest_architecture=aarch64
          android_version=13
          android_sys_boot_completed=1
          qemu_display_device=virtio-gpu-pci
          drm_card0=present
          wayland_socket=present
          weston_redroid_service=active
          redroid_ui_service=active
          weston_process=running
          scrcpy_process=running
          physical_iphone_boot_verified=false
          EOF
          cleanup
          trap - EXIT

      - name: Upload DRM and UI proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: redroid-arm64-drm-ui-proof
          path: |
            redroid-drm-ui-verification.txt
            android-ui-status.txt
            android-ui-journal.txt
            android-drm-state.txt
            qemu-arm64-drm-ui.log
          if-no-files-found: warn
          retention-days: 30
