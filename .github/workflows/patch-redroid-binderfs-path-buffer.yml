name: Fix BinderFS allocator path buffer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-redroid-binderfs-path-buffer.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Increase validated binderfs path buffer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/build_redroid_arm64_rootfs.sh')
          text = path.read_text(encoding='utf-8')
          old = '          char path[256];\n'
          new = '          char path[512];\n'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one BinderFS path buffer, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          bash -n scripts/build_redroid_arm64_rootfs.sh
          grep -Fq 'char path[512];' scripts/build_redroid_arm64_rootfs.sh

          git rm .github/workflows/patch-redroid-binderfs-path-buffer.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/build_redroid_arm64_rootfs.sh
          git commit -m "Fix BinderFS allocator path buffer"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          exit 1
