name: Build and boot-test no-JIT ARM64 Redroid IPA

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the complete unsigned IPA prerelease after Android boot verification
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - "scripts/build_redroid_arm64_rootfs.sh"
      - "scripts/make_redroid_arm64_utm.py"
      - "scripts/build_livecontainer_redroid_arm64_se_ipa.sh"
      - "runtime/livecontainer-guest/AndroidRedroidGuestBootstrap.m"
      - ".github/workflows/build-redroid-arm64-se-livecontainer-ipa.yml"

permissions:
  contents: write

concurrency:
  group: redroid-arm64-se-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: v0.4.0-redroid13-arm64-se-nojit
  IPA_NAME: Android-iOSEmulator-Redroid13-ARM64-SE-NoJIT-unsigned.ipa

jobs:
  build-guest:
    name: Build and boot Android 13 on native ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Checkout repository with pinned builder history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reclaim runner storage
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h

      - name: Install ARM64 guest and boot-test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap qemu-user-static binfmt-support crossbuild-essential-arm64 \
            bc bison flex libssl-dev libelf-dev dwarves cpio rsync xz-utils \
            e2fsprogs skopeo umoci jq git ca-certificates curl zstd \
            qemu-system-arm adb
          sudo update-binfmts --enable qemu-aarch64 || true
          uname -a
          uname -m | grep -qx aarch64
          qemu-system-aarch64 --version
          df -h

      - name: Build deterministic ARM64 Linux and Redroid guest
        shell: bash
        run: |
          set -o pipefail
          sudo --preserve-env=GITHUB_WORKSPACE bash -x ./scripts/build_redroid_arm64_rootfs.sh \
            2>&1 | tee redroid-arm64-guest-build.log
          sudo chown -R "$(id -u):$(id -g)" build/redroid-arm64-guest .build/redroid-arm64-rootfs

      - name: Verify static guest contract
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/redroid-arm64-guest
          for required in kernel initrd.img redroid-arm64-rootfs.raw build-manifest.txt SHA256SUMS; do
            test -f "$OUT/$required"
          done
          grep -q '^Guest architecture: aarch64$' "$OUT/build-manifest.txt"
          grep -q '^Execution mode: UTM SE threaded interpreter (no JIT)$' "$OUT/build-manifest.txt"
          grep -q '^Linux page size: 4K$' "$OUT/build-manifest.txt"
          grep -q '^BinderFS: enabled and mounted before Android$' "$OUT/build-manifest.txt"
          grep -q '^DMA-BUF system heap: built in and passed into Android$' "$OUT/build-manifest.txt"
          grep -q '^Android runtime: Redroid 13 64-bit only$' "$OUT/build-manifest.txt"
          grep -q '^Host bootconfig masked from Android: yes$' "$OUT/build-manifest.txt"
          grep -q '^External AOSP product archive required: no$' "$OUT/build-manifest.txt"
          grep -q '^CI Android boot verification: pending$' "$OUT/build-manifest.txt"
          file "$OUT/kernel"
          sudo e2fsck -fn "$OUT/redroid-arm64-rootfs.raw"

      - name: Boot Android and require sys.boot_completed
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/redroid-arm64-guest
          ROOT_DISK="$OUT/redroid-arm64-rootfs.raw"
          QEMU_LOG=qemu-arm64-android-boot.log
          BOOT_PROPS=android-boot-properties.txt
          rm -f "$QEMU_LOG" "$BOOT_PROPS"
          {
            echo "Redroid CI QEMU pre-launch diagnostics"
            echo "root_disk=$ROOT_DISK"
            stat "$ROOT_DISK"
            df -h
          } > "$QEMU_LOG"

          adb kill-server >/dev/null 2>&1 || true
          adb start-server

          timeout --signal=TERM --kill-after=30s 35m \
            qemu-system-aarch64 \
              -machine virt,highmem=off \
              -accel tcg,thread=multi \
              -cpu max \
              -smp 2 \
              -m 2048 \
              -kernel "$OUT/kernel" \
              -initrd "$OUT/initrd.img" \
              -append 'root=/dev/vda rw rootwait rootfstype=ext4 console=ttyAMA0 earlycon=pl011,0x09000000 systemd.show_status=auto systemd.log_target=console loglevel=4' \
              -drive "if=none,file=$ROOT_DISK,format=raw,id=rootfs,cache=unsafe" \
              -device virtio-blk-pci,drive=rootfs \
              -netdev user,id=net0,hostfwd=tcp:127.0.0.1:5555-:5555 \
              -device virtio-net-pci,netdev=net0 \
              -device virtio-rng-pci \
              -display none \
              -monitor none \
              -serial stdio \
              -snapshot \
              -no-reboot >>"$QEMU_LOG" 2>&1 &
          QEMU_WRAPPER_PID=$!
          cleanup() {
            kill "$QEMU_WRAPPER_PID" >/dev/null 2>&1 || true
            wait "$QEMU_WRAPPER_PID" >/dev/null 2>&1 || true
            adb disconnect 127.0.0.1:5555 >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          BOOTED=0
          for _ in $(seq 1 1200); do
            adb connect 127.0.0.1:5555 >/dev/null 2>&1 || true
            if [[ "$(adb -s 127.0.0.1:5555 get-state 2>/dev/null || true)" == device ]]; then
              VALUE="$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [[ "$VALUE" == 1 ]]; then
                BOOTED=1
                break
              fi
            fi
            if ! kill -0 "$QEMU_WRAPPER_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [[ "$BOOTED" -ne 1 ]]; then
            tail -n 400 "$QEMU_LOG" || true
            exit 1
          fi

          adb -s 127.0.0.1:5555 shell getprop > "$BOOT_PROPS"
          ANDROID_VERSION="$(adb -s 127.0.0.1:5555 shell getprop ro.build.version.release | tr -d '\r')"
          PRIMARY_ABI="$(adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abi | tr -d '\r')"
          ABI_LIST="$(adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abilist | tr -d '\r')"
          [[ "$ANDROID_VERSION" == 13 ]]
          [[ "$PRIMARY_ABI" == arm64-v8a ]]
          [[ "$ABI_LIST" == *arm64-v8a* ]]
          adb -s 127.0.0.1:5555 shell 'test -e /dev/binder && test -e /dev/hwbinder && test -e /dev/vndbinder'
          adb -s 127.0.0.1:5555 shell 'test -e /dev/dma_heap/system'
          ! grep -Eqi 'kernel panic|not syncing|VFS: Unable to mount root' "$QEMU_LOG"

          sed -i 's/^CI Android boot verification: pending$/CI Android boot verification: passed/' "$OUT/build-manifest.txt"
          cat >> "$OUT/build-manifest.txt" <<EOF
          CI boot runner architecture: aarch64
          CI QEMU machine: virt,highmem=off
          CI QEMU CPU: max
          CI Android version: $ANDROID_VERSION
          CI Android primary ABI: $PRIMARY_ABI
          CI Android ABI list: $ABI_LIST
          CI Android sys.boot_completed: 1
          EOF
          grep -q '^CI Android boot verification: passed$' "$OUT/build-manifest.txt"
          grep -q '^CI Android sys.boot_completed: 1$' "$OUT/build-manifest.txt"
          cleanup
          trap - EXIT

      - name: Upload guest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redroid-arm64-guest-diagnostics
          path: |
            redroid-arm64-guest-build.log
            qemu-arm64-android-boot.log
            android-boot-properties.txt
            build/redroid-arm64-guest/build-manifest.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Compress sparse guest for macOS packaging
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^CI Android boot verification: passed$' build/redroid-arm64-guest/build-manifest.txt
          tar --sparse -cf - -C build/redroid-arm64-guest \
            kernel initrd.img redroid-arm64-rootfs.raw build-manifest.txt SHA256SUMS | \
            zstd -15 -T0 -o redroid-arm64-guest.tar.zst
          test -s redroid-arm64-guest.tar.zst
          ls -lh redroid-arm64-guest.tar.zst
          df -h

      - name: Upload verified ARM64 guest payload
        uses: actions/upload-artifact@v4
        with:
          name: redroid-arm64-guest
          path: redroid-arm64-guest.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  package-ipa:
    name: Package and validate import-safe IPA
    needs: build-guest
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download verified ARM64 guest
        uses: actions/download-artifact@v4
        with:
          name: redroid-arm64-guest
          path: .downloaded-redroid-guest

      - name: Select Xcode and install packaging tools
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)"
          test -n "$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          brew install zstd jq gnu-tar bash
          xcodebuild -version

      - name: Restore sparse ARM64 guest
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find .downloaded-redroid-guest -type f -name redroid-arm64-guest.tar.zst -print -quit)"
          test -n "$ARCHIVE"
          GUEST_DIR="$PWD/.downloaded-redroid-guest/extracted"
          mkdir -p "$GUEST_DIR"
          zstd -d --stdout "$ARCHIVE" | gtar --sparse -xf - -C "$GUEST_DIR"
          grep -q '^CI Android boot verification: passed$' "$GUEST_DIR/build-manifest.txt"
          grep -q '^CI Android sys.boot_completed: 1$' "$GUEST_DIR/build-manifest.txt"
          echo "GUEST_DIR=$GUEST_DIR" >> "$GITHUB_ENV"

      - name: Build complete no-JIT LiveContainer IPA
        shell: bash
        run: |
          set -o pipefail
          "$(brew --prefix)/bin/bash" -x ./scripts/build_livecontainer_redroid_arm64_se_ipa.sh "$GUEST_DIR" \
            2>&1 | tee redroid-arm64-ipa-build.log

      - name: Verify final IPA and import metadata
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/livecontainer-redroid-arm64-se
          IPA="$OUT/$IPA_NAME"
          test -f "$IPA"
          unzip -t "$IPA" >/dev/null
          grep -q '^Guest architecture: aarch64$' "$OUT/build-manifest.txt"
          grep -q '^Android runtime: Redroid 13 64-bit only$' "$OUT/build-manifest.txt"
          grep -q '^CI Android boot verification: passed$' "$OUT/build-manifest.txt"
          grep -q '^JIT required by LiveContainer: no$' "$OUT/build-manifest.txt"
          grep -q '^x86_64 backend retained: no$' "$OUT/build-manifest.txt"
          grep -q '^isJITNeeded=false$' "$OUT/livecontainer-import-metadata.txt"
          grep -q 'qemu-aarch64-softmmu.framework/' "$OUT/ipa-contents.txt"
          ! grep -q 'qemu-x86_64-softmmu.framework/' "$OUT/ipa-contents.txt"
          test "$(stat -f%z "$IPA")" -lt 2147483648

      - name: Upload complete unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Android-iOSEmulator-Redroid13-ARM64-SE-NoJIT-unsigned
          path: |
            build/livecontainer-redroid-arm64-se/*.ipa
            build/livecontainer-redroid-arm64-se/*.sha256
            build/livecontainer-redroid-arm64-se/build-manifest.txt
            build/livecontainer-redroid-arm64-se/livecontainer-import-metadata.txt
            build/livecontainer-redroid-arm64-se/archive-entry-order.txt
            redroid-arm64-ipa-build.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish verified no-JIT ARM64 prerelease
        if: ${{ github.event_name == 'push' || inputs.publish_release == true }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT=build/livecontainer-redroid-arm64-se
          IPA="$OUT/$IPA_NAME"
          SIZE="$(stat -f%z "$IPA")"
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$RELEASE_TAG" "$IPA" \
            --target "$GITHUB_SHA" \
            --title "Android iOSEmulator — Redroid 13 ARM64 no-JIT" \
            --notes "One complete unsigned LiveContainer IPA. CI booted this exact ARM64 kernel, initramfs and root disk under QEMU and required Android 13 to report sys.boot_completed=1 before packaging. The runtime contains no x86 Android guest and requests no JIT. Physical iPhone 16 / iOS 27 beta 3 boot remains a separate device-validation gate." \
            --prerelease
          RELEASE_JSON="$(gh release view "$RELEASE_TAG" --json url,assets,isPrerelease)"
          test "$(jq '.assets | length' <<<"$RELEASE_JSON")" -eq 1
          test "$(jq -r '.assets[0].name' <<<"$RELEASE_JSON")" = "$IPA_NAME"
          test "$(jq '.assets[0].size' <<<"$RELEASE_JSON")" -eq "$SIZE"
          test "$(jq -r '.isPrerelease' <<<"$RELEASE_JSON")" = true
          echo "$RELEASE_JSON" > "$OUT/release.json"

      - name: Record verified release marker
        if: ${{ github.event_name == 'push' || inputs.publish_release == true }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT=build/livecontainer-redroid-arm64-se
          IPA="$OUT/$IPA_NAME"
          SIZE="$(stat -f%z "$IPA")"
          RELEASE_URL="$(jq -r .url "$OUT/release.json")"
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .github/release-status
          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg release_url "$RELEASE_URL" \
            --arg asset_name "$IPA_NAME" \
            --argjson asset_size_bytes "$SIZE" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --arg source_commit "$GITHUB_SHA" \
            '{
              verified: true,
              android_version: 13,
              android_sys_boot_completed: true,
              runtime: "Redroid 13 arm64-only",
              guest_architecture: "aarch64",
              ci_runner_architecture: "aarch64",
              execution_mode: "UTM SE interpreter",
              jit_required: false,
              binderfs: true,
              dma_buf_system_heap: true,
              linux_page_size_kib: 4,
              x86_guest_present: false,
              tag: $tag,
              release_url: $release_url,
              asset_name: $asset_name,
              asset_size_bytes: $asset_size_bytes,
              workflow_run_id: $workflow_run_id,
              source_commit: $source_commit,
              physical_iphone_boot_verified: false
            }' > .github/release-status/redroid-arm64-se.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/release-status/redroid-arm64-se.json
          git commit -m "Record verified no-JIT ARM64 Android release"
          git push origin HEAD:main
