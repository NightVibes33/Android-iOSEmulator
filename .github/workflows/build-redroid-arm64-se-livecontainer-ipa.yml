name: Build and boot-test no-JIT ARM64 Redroid IPA

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the complete unsigned IPA prerelease after Android boot verification
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - "scripts/build_redroid_arm64_rootfs.sh"
      - "scripts/make_redroid_arm64_utm.py"
      - "scripts/build_livecontainer_redroid_arm64_se_ipa.sh"
      - "runtime/livecontainer-guest/AndroidRedroidGuestBootstrap.m"
      - ".github/workflows/build-redroid-arm64-se-livecontainer-ipa.yml"

permissions:
  contents: write

concurrency:
  group: redroid-arm64-se-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-guest:
    name: Build and boot Android 13 ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reclaim runner storage
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h

      - name: Install ARM64 guest and boot-test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap qemu-user-static qemu-system-arm binfmt-support crossbuild-essential-arm64 \
            bc bison flex libssl-dev libelf-dev dwarves cpio rsync xz-utils \
            e2fsprogs skopeo umoci jq git ca-certificates zstd adb
          sudo update-binfmts --enable qemu-aarch64
          update-binfmts --display qemu-aarch64
          qemu-system-aarch64 --version
          adb version

      - name: Build no-JIT ARM64 Android guest
        shell: bash
        run: |
          set -o pipefail
          sudo --preserve-env=GITHUB_WORKSPACE bash -x ./scripts/build_redroid_arm64_rootfs.sh 2>&1 | tee redroid-arm64-guest-build.log
          sudo chown -R "$(id -u):$(id -g)" build/redroid-arm64-guest .build/redroid-arm64-rootfs

      - name: Verify static guest contract
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/redroid-arm64-guest
          for required in kernel initrd.img redroid-arm64-rootfs.raw build-manifest.txt SHA256SUMS; do
            test -f "$OUT/$required"
          done
          grep -q '^Guest architecture: aarch64$' "$OUT/build-manifest.txt"
          grep -q '^Execution mode: UTM SE threaded interpreter (no JIT)$' "$OUT/build-manifest.txt"
          grep -q '^Binder IPC: built in$' "$OUT/build-manifest.txt"
          grep -q '^BinderFS: enabled and mounted before Android$' "$OUT/build-manifest.txt"
          grep -q '^DMA-BUF system heap: built in and passed into Android$' "$OUT/build-manifest.txt"
          grep -q '^IPv6: enabled$' "$OUT/build-manifest.txt"
          grep -q '^Android runtime: Redroid 13 64-bit only$' "$OUT/build-manifest.txt"
          grep -q '^Redroid image: docker.io/redroid/redroid:13.0.0_64only-240527$' "$OUT/build-manifest.txt"
          grep -q '^Redroid digest prefix verified: sha256:c815ac1b1d5b$' "$OUT/build-manifest.txt"
          grep -q '^Host bootconfig masked from Android: yes$' "$OUT/build-manifest.txt"
          grep -q '^External AOSP product archive required: no$' "$OUT/build-manifest.txt"
          file "$OUT/kernel" | grep -Eq 'ARM aarch64|Linux kernel ARM64|data'
          sudo e2fsck -fn "$OUT/redroid-arm64-rootfs.raw"

      - name: Boot the exact guest and require Android boot completion
        shell: bash
        run: |
          set -euo pipefail
          OUT="$PWD/build/redroid-arm64-guest"
          TEST_DIR="$PWD/.build/redroid-ci-boot"
          rm -rf "$TEST_DIR"
          mkdir -p "$TEST_DIR"
          cp --reflink=auto --sparse=always "$OUT/redroid-arm64-rootfs.raw" "$TEST_DIR/rootfs.raw"
          adb kill-server >/dev/null 2>&1 || true

          timeout --signal=TERM --kill-after=30s 2100 \
            qemu-system-aarch64 \
              -machine virt,highmem=off \
              -accel tcg,thread=multi \
              -cpu max \
              -smp 2 \
              -m 2048 \
              -kernel "$OUT/kernel" \
              -initrd "$OUT/initrd.img" \
              -append 'root=/dev/vda rw rootwait rootfstype=ext4 console=ttyAMA0 earlycon=pl011,0x09000000 systemd.unit=multi-user.target systemd.show_status=yes loglevel=4' \
              -drive if=none,id=rootfs,file="$TEST_DIR/rootfs.raw",format=raw,cache=unsafe \
              -device virtio-blk-pci,drive=rootfs \
              -netdev user,id=net0,hostfwd=tcp:127.0.0.1:5555-:5555 \
              -device virtio-net-pci,netdev=net0,mac=52:54:00:41:4e:44 \
              -device virtio-rng-pci \
              -display none \
              -monitor none \
              -serial stdio \
              -no-reboot \
            > redroid-arm64-serial.log 2>&1 &
          QEMU_WRAPPER_PID=$!

          cleanup() {
            adb disconnect 127.0.0.1:5555 >/dev/null 2>&1 || true
            kill "$QEMU_WRAPPER_PID" >/dev/null 2>&1 || true
            wait "$QEMU_WRAPPER_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          BOOTED=0
          for attempt in $(seq 1 300); do
            if ! kill -0 "$QEMU_WRAPPER_PID" >/dev/null 2>&1; then
              echo "QEMU stopped before Android completed boot." >&2
              tail -n 300 redroid-arm64-serial.log >&2 || true
              exit 1
            fi
            adb connect 127.0.0.1:5555 >/dev/null 2>&1 || true
            STATE="$(adb -s 127.0.0.1:5555 get-state 2>/dev/null || true)"
            if [[ "$STATE" == device ]]; then
              COMPLETE="$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r\n' || true)"
              if [[ "$COMPLETE" == 1 ]]; then
                BOOTED=1
                break
              fi
            fi
            sleep 5
          done

          if [[ "$BOOTED" != 1 ]]; then
            echo "Android did not report sys.boot_completed=1 within 25 minutes." >&2
            tail -n 500 redroid-arm64-serial.log >&2 || true
            exit 1
          fi

          adb -s 127.0.0.1:5555 shell getprop > redroid-adb-getprop.txt
          adb -s 127.0.0.1:5555 shell dmesg > redroid-android-dmesg.txt 2>&1 || true
          adb -s 127.0.0.1:5555 logcat -d -b all > redroid-logcat.txt 2>&1 || true
          test "$(adb -s 127.0.0.1:5555 shell getprop ro.build.version.release | tr -d '\r\n')" = 13
          adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abilist64 | grep -q 'arm64-v8a'
          adb -s 127.0.0.1:5555 shell 'test -e /dev/binder && test -e /dev/hwbinder && test -e /dev/vndbinder'
          adb -s 127.0.0.1:5555 shell 'test -d /dev/dma_heap'
          sed -i 's/^CI Android boot verification: pending$/CI Android boot verification: passed/' "$OUT/build-manifest.txt"
          grep -q '^CI Android boot verification: passed$' "$OUT/build-manifest.txt"

      - name: Upload boot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redroid-arm64-ci-boot-diagnostics
          path: |
            redroid-arm64-guest-build.log
            redroid-arm64-serial.log
            redroid-adb-getprop.txt
            redroid-android-dmesg.txt
            redroid-logcat.txt
            build/redroid-arm64-guest/build-manifest.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Compress sparse boot-verified guest payload for transfer
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^CI Android boot verification: passed$' build/redroid-arm64-guest/build-manifest.txt
          tar --sparse -cf - -C build/redroid-arm64-guest \
            kernel initrd.img redroid-arm64-rootfs.raw build-manifest.txt SHA256SUMS | \
            zstd -19 -T0 -o redroid-arm64-guest.tar.zst
          test -s redroid-arm64-guest.tar.zst
          ls -lh redroid-arm64-guest.tar.zst

      - name: Upload boot-verified ARM64 guest payload
        uses: actions/upload-artifact@v4
        with:
          name: redroid-arm64-guest
          path: |
            redroid-arm64-guest.tar.zst
            redroid-arm64-guest-build.log
            redroid-arm64-serial.log
            redroid-adb-getprop.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  package-ipa:
    name: Package import-safe boot-verified no-JIT IPA
    needs: build-guest
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download boot-verified ARM64 guest payload
        uses: actions/download-artifact@v4
        with:
          name: redroid-arm64-guest
          path: .downloaded-redroid-guest

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)"
          test -n "$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          brew install zstd jq gnu-tar bash
          xcodebuild -version

      - name: Extract and locate downloaded guest files
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find .downloaded-redroid-guest -type f -name redroid-arm64-guest.tar.zst -print -quit)"
          test -n "$ARCHIVE"
          GUEST_DIR="$PWD/.downloaded-redroid-guest/extracted"
          mkdir -p "$GUEST_DIR"
          zstd -d --stdout "$ARCHIVE" | gtar --sparse -xf - -C "$GUEST_DIR"
          for required in kernel initrd.img redroid-arm64-rootfs.raw build-manifest.txt; do
            test -f "$GUEST_DIR/$required"
          done
          grep -q '^CI Android boot verification: passed$' "$GUEST_DIR/build-manifest.txt"
          echo "GUEST_DIR=$GUEST_DIR" >> "$GITHUB_ENV"

      - name: Build complete LiveContainer IPA
        shell: bash
        run: |
          set -o pipefail
          "$(brew --prefix)/bin/bash" -x ./scripts/build_livecontainer_redroid_arm64_se_ipa.sh "$GUEST_DIR" 2>&1 | tee redroid-arm64-ipa-build.log

      - name: Verify final IPA architecture, CI boot and import metadata
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/livecontainer-redroid-arm64-se
          IPA="$OUT/Android-iOSEmulator-Redroid13-ARM64-SE-NoJIT-unsigned.ipa"
          test -f "$IPA"
          unzip -t "$IPA" >/dev/null
          grep -q '^Guest architecture: aarch64$' "$OUT/build-manifest.txt"
          grep -q '^Android runtime: Redroid 13 64-bit only$' "$OUT/build-manifest.txt"
          grep -q '^CI Android boot verification: passed$' "$OUT/build-manifest.txt"
          grep -q '^JIT required by LiveContainer: no$' "$OUT/build-manifest.txt"
          grep -q '^x86_64 backend retained: no$' "$OUT/build-manifest.txt"
          grep -q '^isJITNeeded=false$' "$OUT/livecontainer-import-metadata.txt"
          grep -q 'qemu-aarch64-softmmu.framework/' "$OUT/ipa-contents.txt"
          ! grep -q 'qemu-x86_64-softmmu.framework/' "$OUT/ipa-contents.txt"

      - name: Upload complete unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Android-iOSEmulator-Redroid13-ARM64-SE-NoJIT-CIBooted-unsigned
          path: |
            build/livecontainer-redroid-arm64-se/*.ipa
            build/livecontainer-redroid-arm64-se/*.sha256
            build/livecontainer-redroid-arm64-se/build-manifest.txt
            build/livecontainer-redroid-arm64-se/livecontainer-import-metadata.txt
            build/livecontainer-redroid-arm64-se/archive-entry-order.txt
            redroid-arm64-ipa-build.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish boot-verified no-JIT ARM64 prerelease
        if: ${{ github.event_name == 'push' || inputs.publish_release == true }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.4.1-redroid13-arm64-se-nojit-ci-boot
          OLD_TAG: v0.4.0-redroid13-arm64-se-nojit
        run: |
          set -euo pipefail
          OUT=build/livecontainer-redroid-arm64-se
          IPA="$OUT/Android-iOSEmulator-Redroid13-ARM64-SE-NoJIT-unsigned.ipa"
          SIZE="$(stat -f%z "$IPA")"
          test "$SIZE" -lt 2147483648
          grep -q '^CI Android boot verification: passed$' "$OUT/build-manifest.txt"
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" "$IPA" \
            --target "$GITHUB_SHA" \
            --title "Android iOSEmulator — Redroid 13 ARM64 no-JIT, CI booted" \
            --notes "One complete unsigned LiveContainer guest IPA. The exact ARM64 Linux plus Redroid 13 guest was booted under QEMU TCG in CI and Android reported sys.boot_completed=1 before packaging. The dated arm64-only Redroid image digest is verified, /proc/bootconfig is masked, BinderFS and DMA-BUF heaps are checked, LiveContainer does not request JIT, and no x86 guest backend is included. Physical iPhone 16 / iOS 27 beta 3 boot remains a separate device-validation gate." \
            --prerelease

          RELEASE_JSON="$(gh release view "$TAG" --json url,assets,isPrerelease)"
          test "$(jq '.assets | length' <<<"$RELEASE_JSON")" -eq 1
          test "$(jq -r '.assets[0].name' <<<"$RELEASE_JSON")" = "$(basename "$IPA")"
          test "$(jq '.assets[0].size' <<<"$RELEASE_JSON")" -eq "$SIZE"
          test "$(jq -r '.isPrerelease' <<<"$RELEASE_JSON")" = true
          echo "$RELEASE_JSON" > "$OUT/release.json"
          gh release delete "$OLD_TAG" --yes --cleanup-tag >/dev/null 2>&1 || true

      - name: Record verified release marker
        if: ${{ github.event_name == 'push' || inputs.publish_release == true }}
        shell: bash
        env:
          TAG: v0.4.1-redroid13-arm64-se-nojit-ci-boot
        run: |
          set -euo pipefail
          OUT=build/livecontainer-redroid-arm64-se
          IPA="$OUT/Android-iOSEmulator-Redroid13-ARM64-SE-NoJIT-unsigned.ipa"
          SIZE="$(stat -f%z "$IPA")"
          RELEASE_URL="$(jq -r .url "$OUT/release.json")"
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .github/release-status
          jq -n \
            --arg tag "$TAG" \
            --arg release_url "$RELEASE_URL" \
            --arg asset_name "$(basename "$IPA")" \
            --argjson asset_size_bytes "$SIZE" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --arg source_commit "$GITHUB_SHA" \
            '{
              verified: true,
              android_version: 13,
              runtime: "Redroid 13 arm64-only",
              guest_architecture: "aarch64",
              execution_mode: "UTM SE interpreter",
              jit_required: false,
              binderfs: true,
              dma_buf_system_heap: true,
              host_bootconfig_masked: true,
              linux_page_size_kib: 4,
              redroid_tag: "13.0.0_64only-240527",
              redroid_digest_prefix: "sha256:c815ac1b1d5b",
              x86_guest_present: false,
              ci_android_boot_verified: true,
              tag: $tag,
              release_url: $release_url,
              asset_name: $asset_name,
              asset_size_bytes: $asset_size_bytes,
              workflow_run_id: $workflow_run_id,
              source_commit: $source_commit,
              physical_iphone_boot_verified: false
            }' > .github/release-status/redroid-arm64-se.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/release-status/redroid-arm64-se.json
          git commit -m "Record CI-booted no-JIT ARM64 Android release"
          git push origin HEAD:main
