name: Build no-JIT AOSP FVP ARM64 LiveContainer IPA

on:
  workflow_dispatch:
    inputs:
      product_out_url:
        description: Direct URL to a zip/tar archive containing kernel, combined-ramdisk.img, system-qemu.img and userdata.img
        required: true
        type: string
      product_out_sha256:
        description: SHA-256 of the product-out archive
        required: true
        type: string
      variant:
        description: AOSP FVP product variant
        required: true
        default: mini
        type: choice
        options:
          - mini
          - full
      publish_release:
        description: Publish the unsigned no-JIT IPA to an ARM64 SE prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: aosp-fvp-arm64-se-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 and install tools
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)"
          test -n "$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          brew install qemu

      - name: Download verified AOSP FVP product output
        shell: bash
        env:
          URL: ${{ inputs.product_out_url }}
          SHA256: ${{ inputs.product_out_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p .build/fvp-download .build/fvp-product
          curl --fail --location --retry 4 --retry-delay 2 "$URL" -o .build/fvp-download/product-out.archive
          printf '%s  %s\n' "$SHA256" .build/fvp-download/product-out.archive | shasum -a 256 -c -
          if unzip -t .build/fvp-download/product-out.archive >/dev/null 2>&1; then
            unzip -q .build/fvp-download/product-out.archive -d .build/fvp-product
          else
            tar -xf .build/fvp-download/product-out.archive -C .build/fvp-product
          fi
          PRODUCT_OUT="$(find .build/fvp-product -type f -name system-qemu.img -exec dirname {} \; | head -1)"
          test -n "$PRODUCT_OUT"
          for required in kernel combined-ramdisk.img system-qemu.img userdata.img; do
            test -f "$PRODUCT_OUT/$required"
          done
          echo "PRODUCT_OUT=$PRODUCT_OUT" >> "$GITHUB_ENV"

      - name: Build no-JIT ARM64 LiveContainer IPA
        shell: bash
        run: |
          set -o pipefail
          bash -x ./scripts/build_livecontainer_arm64_fvp_ipa.sh "$PRODUCT_OUT" '${{ inputs.variant }}' 2>&1 | tee arm64-fvp-se-build.log

      - name: Verify final no-JIT architecture and storage contract
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/livecontainer-arm64-fvp-se
          IPA="$OUT/Android-iOSEmulator-AOSP-FVP-ARM64-SE-NoJIT-${{ inputs.variant }}-unsigned.ipa"
          test -f "$IPA"
          unzip -t "$IPA" >/dev/null
          grep -q '^Runtime architecture: aarch64$' "$OUT/build-manifest.txt"
          grep -q '^Execution mode: UTM SE interpreter$' "$OUT/build-manifest.txt"
          grep -q '^QEMU machine: virt,mte=on$' "$OUT/build-manifest.txt"
          grep -q '^System storage: sparse raw system-qemu image$' "$OUT/build-manifest.txt"
          grep -q '^Userdata storage: sparse raw userdata image$' "$OUT/build-manifest.txt"
          grep -q '^Direct kernel boot: yes$' "$OUT/build-manifest.txt"
          grep -q '^JIT required: no$' "$OUT/build-manifest.txt"
          grep -q '^UTM backend retained: qemu-aarch64-softmmu$' "$OUT/build-manifest.txt"
          grep -q '^x86_64 backend retained: no$' "$OUT/build-manifest.txt"
          unzip -Z1 "$IPA" | grep -q 'qemu-aarch64-softmmu.framework/'
          ! unzip -Z1 "$IPA" | grep -q 'qemu-x86_64-softmmu.framework/'
          unzip -Z1 "$IPA" | grep -q 'system-qemu.raw.img'
          unzip -Z1 "$IPA" | grep -q 'userdata.raw.img'

          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          unzip -q "$IPA" \
            'Payload/Android iOSEmulator ARM64 SE.app/LCAppInfo.plist' \
            'Payload/Android iOSEmulator ARM64 SE.app/PreloadedData/Android-ARM64-SE.utm/config.plist' \
            -d "$VERIFY_DIR"
          LC_INFO="$VERIFY_DIR/Payload/Android iOSEmulator ARM64 SE.app/LCAppInfo.plist"
          CONFIG="$VERIFY_DIR/Payload/Android iOSEmulator ARM64 SE.app/PreloadedData/Android-ARM64-SE.utm/config.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :isJITNeeded' "$LC_INFO")" = false
          test "$(/usr/libexec/PlistBuddy -c 'Print :System:Architecture' "$CONFIG")" = aarch64
          test "$(/usr/libexec/PlistBuddy -c 'Print :System:CPU' "$CONFIG")" = max
          test "$(/usr/libexec/PlistBuddy -c 'Print :System:Target' "$CONFIG")" = virt
          test "$(/usr/libexec/PlistBuddy -c 'Print :System:MachineProperties' "$CONFIG")" = 'mte=on'
          test "$(/usr/libexec/PlistBuddy -c 'Print :Debug:DebugLog' "$CONFIG")" = false

      - name: Upload no-JIT ARM64 IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-iOSEmulator-AOSP-FVP-ARM64-SE-NoJIT-${{ inputs.variant }}-unsigned
          path: |
            build/livecontainer-arm64-fvp-se/*.ipa
            build/livecontainer-arm64-fvp-se/*.sha256
            build/livecontainer-arm64-fvp-se/build-manifest.txt
            arm64-fvp-se-build.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish no-JIT ARM64 SE prerelease
        if: inputs.publish_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          TAG="v0.3.0-aosp-fvp-arm64-se-nojit-${VARIANT}"
          IPA="build/livecontainer-arm64-fvp-se/Android-iOSEmulator-AOSP-FVP-ARM64-SE-NoJIT-${VARIANT}-unsigned.ipa"
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" "$IPA" \
            --target "$GITHUB_SHA" \
            --title "Android iOSEmulator — AOSP FVP ARM64 SE no-JIT ${VARIANT}" \
            --notes "Unsigned no-JIT fallback for devices where JIT cannot be enabled, including the current iOS 27 beta testing path. Uses official AOSP FVP ARM64 images, direct kernel boot, aarch64 QEMU virt,mte=on, sparse raw system/userdata disks, reduced logging, no x86 backend and isJITNeeded=false. UTM SE uses a slower interpreter, so physical-device boot speed and Android UI usability remain validation gates rather than completed claims." \
            --prerelease
