name: Build no-JIT AOSP FVP ARM64 LiveContainer IPA

on:
  workflow_dispatch:
    inputs:
      source_mode:
        description: Obtain FVP images automatically from Android CI or use a custom verified archive
        required: true
        default: android_ci
        type: choice
        options:
          - android_ci
          - custom_archive
      product_out_url:
        description: Custom archive URL; required only when source_mode is custom_archive
        required: false
        type: string
      product_out_sha256:
        description: Custom archive SHA-256; required only when source_mode is custom_archive
        required: false
        type: string
      variant:
        description: AOSP FVP product variant
        required: true
        default: mini
        type: choice
        options:
          - mini
          - full
      publish_release:
        description: Publish the verified unsigned IPA to Releases
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - "scripts/fetch_aosp_fvp_from_android_ci.py"
      - "scripts/make_aosp_fvp_arm64_utm.py"
      - "scripts/build_livecontainer_arm64_fvp_ipa.sh"
      - "runtime/livecontainer-guest/AndroidArm64GuestBootstrap.m"
      - ".github/workflows/build-arm64-fvp-livecontainer-ipa.yml"

permissions:
  contents: write

concurrency:
  group: aosp-fvp-arm64-se-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 240
    env:
      SOURCE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.source_mode || 'android_ci' }}
      VARIANT: ${{ github.event_name == 'workflow_dispatch' && inputs.variant || 'mini' }}
      PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 and install tools
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)"
          test -n "$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          brew install qemu jq
          python3 --version
          qemu-img --version

      - name: Resolve verified AOSP FVP product output
        id: resolve
        shell: bash
        env:
          CUSTOM_URL: ${{ inputs.product_out_url }}
          CUSTOM_SHA256: ${{ inputs.product_out_sha256 }}
        run: |
          set -euo pipefail
          rm -rf .build/fvp-product .build/fvp-download
          mkdir -p .build/fvp-product .build/fvp-download

          if [[ "$SOURCE_MODE" == "custom_archive" ]]; then
            test -n "$CUSTOM_URL"
            test -n "$CUSTOM_SHA256"
            curl --fail --location --retry 4 --retry-delay 2 "$CUSTOM_URL" -o .build/fvp-download/product-out.archive
            printf '%s  %s\n' "$CUSTOM_SHA256" .build/fvp-download/product-out.archive | shasum -a 256 -c -
            python3 ./scripts/fetch_aosp_fvp_from_android_ci.py \
              --variant "$VARIANT" \
              --archive-url "file://$PWD/.build/fvp-download/product-out.archive" \
              --output .build/fvp-product \
              --diagnostics .build/fvp-resolver.json \
              --max-artifacts 1
          else
            python3 ./scripts/fetch_aosp_fvp_from_android_ci.py \
              --variant "$VARIANT" \
              --output .build/fvp-product \
              --diagnostics .build/fvp-resolver.json
          fi

          jq -e '.verified == true' .build/fvp-resolver.json >/dev/null
          for required in kernel combined-ramdisk.img system-qemu.img userdata.img; do
            test -s ".build/fvp-product/$required"
          done
          echo "PRODUCT_OUT=$PWD/.build/fvp-product" >> "$GITHUB_ENV"

      - name: Build no-JIT ARM64 LiveContainer IPA
        shell: bash
        run: |
          set -o pipefail
          bash -x ./scripts/build_livecontainer_arm64_fvp_ipa.sh "$PRODUCT_OUT" "$VARIANT" 2>&1 | tee arm64-fvp-se-build.log

      - name: Verify final FVP MMIO, no-JIT and ARM64 contract
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/livecontainer-arm64-fvp-se
          IPA="$OUT/Android-iOSEmulator-AOSP-FVP-ARM64-SE-NoJIT-${VARIANT}-unsigned.ipa"
          test -f "$IPA"
          unzip -t "$IPA" >/dev/null
          grep -q '^Runtime architecture: aarch64$' "$OUT/build-manifest.txt"
          grep -q '^Android target: AOSP fvpbase' "$OUT/build-manifest.txt"
          grep -q '^Execution mode: UTM SE interpreter$' "$OUT/build-manifest.txt"
          grep -q '^QEMU machine: virt,mte=on$' "$OUT/build-manifest.txt"
          grep -q '^AOSP hardware: fvpbase$' "$OUT/build-manifest.txt"
          grep -q '^Storage transport: virtio-mmio$' "$OUT/build-manifest.txt"
          grep -q '^Network transport: virtio-mmio$' "$OUT/build-manifest.txt"
          grep -q '^RNG transport: virtio-mmio$' "$OUT/build-manifest.txt"
          grep -q '^UTM generic ARM PCI storage: disabled$' "$OUT/build-manifest.txt"
          grep -q '^UTM generic ARM PCI network: disabled$' "$OUT/build-manifest.txt"
          grep -q '^Direct kernel boot: yes$' "$OUT/build-manifest.txt"
          grep -q '^JIT required: no$' "$OUT/build-manifest.txt"
          grep -q '^UTM backend retained: qemu-aarch64-softmmu$' "$OUT/build-manifest.txt"
          grep -q '^x86_64 backend retained: no$' "$OUT/build-manifest.txt"
          unzip -Z1 "$IPA" | grep -q 'qemu-aarch64-softmmu.framework/'
          ! unzip -Z1 "$IPA" | grep -q 'qemu-x86_64-softmmu.framework/'
          unzip -Z1 "$IPA" | grep -q 'system-qemu.raw.img'
          unzip -Z1 "$IPA" | grep -q 'userdata.raw.img'

          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          unzip -q "$IPA" \
            'Payload/Android iOSEmulator ARM64 SE.app/LCAppInfo.plist' \
            'Payload/Android iOSEmulator ARM64 SE.app/PreloadedData/Android-ARM64-SE.utm/config.plist' \
            -d "$VERIFY_DIR"
          LC_INFO="$VERIFY_DIR/Payload/Android iOSEmulator ARM64 SE.app/LCAppInfo.plist"
          CONFIG="$VERIFY_DIR/Payload/Android iOSEmulator ARM64 SE.app/PreloadedData/Android-ARM64-SE.utm/config.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :isJITNeeded' "$LC_INFO")" = false
          test "$(/usr/libexec/PlistBuddy -c 'Print :System:Architecture' "$CONFIG")" = aarch64
          test "$(/usr/libexec/PlistBuddy -c 'Print :System:CPU' "$CONFIG")" = max
          test "$(/usr/libexec/PlistBuddy -c 'Print :System:Target' "$CONFIG")" = virt
          test "$(/usr/libexec/PlistBuddy -c 'Print :System:MachineProperties' "$CONFIG")" = 'mte=on'
          test "$(/usr/libexec/PlistBuddy -c 'Print :System:RngEnabled' "$CONFIG")" = false
          test "$(/usr/libexec/PlistBuddy -c 'Print :Networking:NetworkMode' "$CONFIG")" = none
          test "$(/usr/libexec/PlistBuddy -c 'Print :Drives:2:InterfaceType' "$CONFIG")" = none
          test "$(/usr/libexec/PlistBuddy -c 'Print :Drives:3:InterfaceType' "$CONFIG")" = none
          test "$(/usr/libexec/PlistBuddy -c 'Print :Debug:DebugLog' "$CONFIG")" = false
          ADD_ARGS="$(/usr/libexec/PlistBuddy -c 'Print :System:AddArgs' "$CONFIG")"
          grep -Fq 'androidboot.hardware=fvpbase' <<<"$ADD_ARGS"
          grep -Fq 'androidboot.boot_devices=a003e00.virtio_mmio' <<<"$ADD_ARGS"
          grep -Fq -- '-device virtio-blk-device,drive=drivesystem' <<<"$ADD_ARGS"
          grep -Fq -- '-device virtio-blk-device,drive=driveuserdata' <<<"$ADD_ARGS"
          grep -Fq -- '-device virtio-net-device,netdev=androidnet' <<<"$ADD_ARGS"
          grep -Fq -- '-device virtio-rng-device' <<<"$ADD_ARGS"

      - name: Upload resolver and build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Android-iOSEmulator-AOSP-FVP-ARM64-SE-diagnostics
          path: |
            .build/fvp-resolver.json
            arm64-fvp-se-build.log
            build/livecontainer-arm64-fvp-se/build-manifest.txt
            build/livecontainer-arm64-fvp-se/ipa-contents.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload no-JIT ARM64 IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: Android-iOSEmulator-AOSP-FVP-ARM64-SE-NoJIT-${{ env.VARIANT }}-unsigned
          path: |
            build/livecontainer-arm64-fvp-se/*.ipa
            build/livecontainer-arm64-fvp-se/*.sha256
            build/livecontainer-arm64-fvp-se/build-manifest.txt
            .build/fvp-resolver.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish verified no-JIT ARM64 SE prerelease
        if: env.PUBLISH_RELEASE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.3.1-aosp-fvp-arm64-se-nojit-${VARIANT}"
          IPA="build/livecontainer-arm64-fvp-se/Android-iOSEmulator-AOSP-FVP-ARM64-SE-NoJIT-${VARIANT}-unsigned.ipa"
          test -f "$IPA"
          jq -e '.verified == true' .build/fvp-resolver.json >/dev/null
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" "$IPA" \
            --target "$GITHUB_SHA" \
            --title "Android iOSEmulator — AOSP FVP ARM64 SE no-JIT ${VARIANT}" \
            --notes "Unsigned no-JIT ARM64 build for iOS 27 beta testing. Uses a SHA-256-recorded AOSP FVP product output, androidboot.hardware=fvpbase, direct kernel boot and the exact VirtIO MMIO block/network/RNG transport expected by AOSP. UTM's generic ARM PCI block and network devices are disabled. The final IPA is rejected unless isJITNeeded=false, qemu-aarch64 is present and x86_64 is absent. Physical iPhone boot remains a device validation gate." \
            --prerelease

      - name: Record ARM64 FVP pipeline status
        if: always()
        continue-on-error: true
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          mkdir -p .github/release-status
          python3 - <<'PY'
          import glob
          import json
          import os
          from pathlib import Path

          resolver_path = Path('.build/fvp-resolver.json')
          resolver = {}
          if resolver_path.is_file():
              try:
                  resolver = json.loads(resolver_path.read_text(encoding='utf-8'))
              except Exception as exc:
                  resolver = {'verified': False, 'parse_error': str(exc)}

          ipas = glob.glob('build/livecontainer-arm64-fvp-se/*.ipa')
          status = {
              'workflow': 'build-arm64-fvp-livecontainer-ipa.yml',
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'source_commit': os.environ.get('GITHUB_SHA'),
              'job_status': os.environ.get('JOB_STATUS'),
              'variant': os.environ.get('VARIANT'),
              'source_mode': os.environ.get('SOURCE_MODE'),
              'resolver_verified': resolver.get('verified', False),
              'selected_branch': resolver.get('selected_branch'),
              'selected_target': resolver.get('selected_target'),
              'selected_url': resolver.get('selected_url'),
              'archive_sha256': resolver.get('archive_sha256'),
              'ipa_built': bool(ipas),
              'ipa_name': Path(ipas[0]).name if ipas else None,
              'hardware': 'fvpbase',
              'storage_transport': 'virtio-mmio',
              'network_transport': 'virtio-mmio',
              'jit_required': False,
              'x86_64_backend': False,
              'device_boot_verified': False,
              'resolver_error': resolver.get('error'),
          }
          Path('.github/release-status/arm64-fvp-ci.json').write_text(
              json.dumps(status, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

          git add .github/release-status/arm64-fvp-ci.json
          if ! git diff --cached --quiet; then
            git commit -m "Record ARM64 FVP pipeline status"
            git push origin HEAD:main
          fi
