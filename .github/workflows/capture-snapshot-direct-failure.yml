name: Capture direct snapshot patch failure

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/capture-snapshot-direct-failure.yml

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: |
          set -euo pipefail
          gh run view 29947169997 --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/snapshot-failure.log
          mkdir -p .github/release-status
          tail -n 160 /tmp/snapshot-failure.log > .github/release-status/snapshot-direct-failure-tail.txt
          git rm .github/workflows/capture-snapshot-direct-failure.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/release-status/snapshot-direct-failure-tail.txt
          git commit -m "Record direct snapshot patch failure"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
