name: Prepare Redroid snapshot candidate

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prepare-redroid-snapshot-candidate.yml

permissions:
  contents: write
  issues: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Create remote commit object without updating a ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/apply_snapshot.py
          python3 /tmp/apply_snapshot.py
          git diff --check

          HEAD_SHA="$(git rev-parse HEAD)"
          BASE_TREE="$(git rev-parse HEAD^{tree})"
          WORKFLOW=.github/workflows/build-redroid-arm64-se-livecontainer-ipa.yml

          BLOB_SHA="$(jq -Rs '{content: ., encoding: "utf-8"}' < "$WORKFLOW" | gh api --method POST "/repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq .sha)"
          TREE_SHA="$(jq -n --arg base_tree "$BASE_TREE" --arg blob "$BLOB_SHA" '{base_tree: $base_tree, tree: [{path: ".github/workflows/build-redroid-arm64-se-livecontainer-ipa.yml", mode: "100644", type: "blob", sha: $blob}]}' | gh api --method POST "/repos/$GITHUB_REPOSITORY/git/trees" --input - --jq .sha)"
          COMMIT_SHA="$(jq -n --arg message "Boot Redroid CI with a QEMU snapshot overlay" --arg tree "$TREE_SHA" --arg parent "$HEAD_SHA" '{message: $message, tree: $tree, parents: [$parent]}' | gh api --method POST "/repos/$GITHUB_REPOSITORY/git/commits" --input - --jq .sha)"

          BODY="$(jq -n --arg parent "$HEAD_SHA" --arg base_tree "$BASE_TREE" --arg blob "$BLOB_SHA" --arg tree "$TREE_SHA" --arg commit "$COMMIT_SHA" '{parent: $parent, base_tree: $base_tree, workflow_blob: $blob, candidate_tree: $tree, candidate_commit: $commit}')"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Redroid snapshot candidate $COMMIT_SHA" --body "$BODY"
          echo "CANDIDATE_COMMIT=$COMMIT_SHA"
