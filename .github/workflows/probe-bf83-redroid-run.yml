name: Probe snapshot-enabled Redroid run

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-bf83-redroid-run.yml"

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Find exact snapshot-enabled build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: "bf83ea2f86d1d4034dc9354dc0eba474c65604ae"
        run: |
          set -euo pipefail
          RUN=null
          for attempt in $(seq 1 30); do
            RUNS="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/build-redroid-arm64-se-livecontainer-ipa.yml/runs?branch=main&per_page=30")"
            RUN="$(jq -c --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last' <<<"$RUNS")"
            if [[ "$RUN" != null ]]; then break; fi
            sleep 2
          done
          test "$RUN" != null
          RUN_ID="$(jq -r .id <<<"$RUN")"
          JOBS="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100")"
          ARTIFACTS="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100")"
          mkdir -p .github/release-status
          jq -n --argjson run "$RUN" --argjson jobs "$JOBS" --argjson artifacts "$ARTIFACTS" '{
            observed_at: (now | todateiso8601),
            run: {id: $run.id, head_sha: $run.head_sha, status: $run.status, conclusion: $run.conclusion, created_at: $run.created_at, updated_at: $run.updated_at, run_started_at: $run.run_started_at, html_url: $run.html_url, attempt: $run.run_attempt},
            jobs: [$jobs.jobs[]? | {id, name, status, conclusion, started_at, completed_at, html_url, steps: [.steps[]? | {number, name, status, conclusion, started_at, completed_at}]}],
            artifacts: [$artifacts.artifacts[]? | {id, name, size_in_bytes, expired, created_at}]
          }' > .github/release-status/redroid-bf83-run.json
          git rm .github/workflows/probe-bf83-redroid-run.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/release-status/redroid-bf83-run.json
          git commit -m "Record snapshot-enabled Redroid run"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          exit 1
