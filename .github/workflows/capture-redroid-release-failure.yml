name: Capture Redroid release publication failure

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-redroid-release-failure.yml"

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture final release error
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: "89031223579"
        run: |
          set -euo pipefail
          mkdir -p .github/release-status
          gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$JOB_ID/logs" > /tmp/package-job.log
          {
            echo "# Package/release job failure tail"
            echo
            tail -n 220 /tmp/package-job.log
          } > .github/release-status/redroid-release-failure.log
          git rm .github/workflows/capture-redroid-release-failure.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/release-status/redroid-release-failure.log
          git commit -m "Record Redroid release publication failure"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          exit 1
