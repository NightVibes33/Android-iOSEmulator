name: Verify full Android release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-full-android-release.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: "v0.1.0-android-x86"
      STATUS_PATH: ".github/release-status/full-android.json"
    steps:
      - name: Wait for IPA-only release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if JSON="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,isPrerelease,assets 2>/dev/null)"; then
              COUNT="$(jq '.assets | length' <<<"$JSON")"
              NAME="$(jq -r '.assets[0].name // empty' <<<"$JSON")"
              if [[ "$COUNT" == "1" && "$NAME" == *.ipa ]]; then
                URL="$(jq -r '.url' <<<"$JSON")"
                PRERELEASE="$(jq -r '.isPrerelease' <<<"$JSON")"
                printf '%s\n' "$JSON" > release.json
                echo "url=$URL" >> "$GITHUB_OUTPUT"
                echo "name=$NAME" >> "$GITHUB_OUTPUT"
                echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Release did not reach the expected IPA-only state." >&2
          exit 1

      - name: Write verified status marker
        shell: bash
        run: |
          set -euo pipefail
          cat > status.json <<EOF
          {
            "verified": true,
            "tag": "$RELEASE_TAG",
            "asset_count": 1,
            "asset_name": "${{ steps.release.outputs.name }}",
            "prerelease": ${{ steps.release.outputs.prerelease }},
            "release_url": "${{ steps.release.outputs.url }}",
            "verified_by_run": "$GITHUB_RUN_ID"
          }
          EOF
          CONTENT="$(base64 -w0 status.json)"
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/contents/$STATUS_PATH" \
            -f message="Record verified IPA-only release" \
            -f content="$CONTENT" \
            -f branch="main"
