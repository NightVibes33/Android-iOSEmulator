name: Apply Redroid CI snapshot boot fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-redroid-ci-snapshot.yml"
      - "scripts/apply_redroid_snapshot_patch.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and apply QEMU snapshot boot patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/apply_redroid_snapshot_patch.py
          python3 scripts/apply_redroid_snapshot_patch.py
          rm .github/workflows/patch-redroid-ci-snapshot.yml
          rm scripts/apply_redroid_snapshot_patch.py
          git diff --check
          grep -q 'ROOT_DISK="$OUT/redroid-arm64-rootfs.raw"' .github/workflows/build-redroid-arm64-se-livecontainer-ipa.yml
          grep -q -- '-snapshot \\' .github/workflows/build-redroid-arm64-se-livecontainer-ipa.yml
          grep -q 'Redroid CI QEMU pre-launch diagnostics' .github/workflows/build-redroid-arm64-se-livecontainer-ipa.yml
          ! grep -q 'TEST_DISK' .github/workflows/build-redroid-arm64-se-livecontainer-ipa.yml

      - name: Commit snapshot boot fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/build-redroid-arm64-se-livecontainer-ipa.yml \
                  .github/workflows/patch-redroid-ci-snapshot.yml \
                  scripts/apply_redroid_snapshot_patch.py
          git commit -m "Boot Redroid CI with a QEMU snapshot overlay"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          exit 1
